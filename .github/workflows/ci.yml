name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Fail fast on a corepack/pnpm mismatch rather than silently resolving a
  # different lockfile shape than the one that was committed.
  CI: 'true'

jobs:
  scope:
    name: select required checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_verify: ${{ steps.changes.outputs.run_verify }}
      run_postgres: ${{ steps.changes.outputs.run_postgres }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select checks from changed files
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "run_verify=true" >> "$GITHUB_OUTPUT"
            echo "run_postgres=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_verify=false
          run_postgres=false

          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*|LICENSE|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                ;;
              *)
                run_verify=true
                ;;
            esac

            case "$path" in
              db/migrations/**|tooling/scripts/migrate.ts|tooling/scripts/check-source-record-reconciliation-postgres.ts|packages/canonical-store/**|services/ingest-worker/**|tooling/scripts/check-credential-provisioning-postgres.ts|tooling/scripts/provision-api-credential.ts|packages/api-keys/**|tooling/scripts/check-scheduled-acquisition-postgres.ts|packages/acquisition/**|apps/acquisition-worker/**|verticals/**|tooling/lib/cli-entry.ts|tests/support/acquisition-rights.ts|packages/canonical-schema/**|packages/normalization/**|packages/source-registry/**|packages/rights-engine/**|package.json|pnpm-lock.yaml|.github/workflows/ci.yml)
                run_postgres=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)

          echo "run_verify=$run_verify" >> "$GITHUB_OUTPUT"
          echo "run_postgres=$run_postgres" >> "$GITHUB_OUTPUT"

  verify:
    name: typecheck • test • migrations • vertical config
    needs: scope
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Fail when scope selection fails
        if: always() && needs.scope.result != 'success'
        run: |
          echo "Scope selection failed; required verification cannot be determined." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable corepack
        if: needs.scope.outputs.run_verify == 'true'
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.scope.outputs.run_verify == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm install --frozen-lockfile

      - name: Documentation-only change
        if: needs.scope.outputs.run_verify != 'true'
        run: echo "No executable or workflow files changed; expensive checks are not required."

      # 1. Types. tsc --strict over every package, test and tooling script.
      - name: Typecheck
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm typecheck

      # 2. Unit and contract tests, including the PGlite migration suite.
      - name: Test
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm test

      # 3. Migration gate. Applies db/migrations in order against a fresh
      #    Postgres (PGlite), verifies every expected table exists, and proves a
      #    re-run is a clean no-op. Catches ordering errors, non-portable SQL and
      #    non-idempotent DDL before they reach a hosted database.
      - name: Migration apply check
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm migrate:check

      # 4. Generated JSON Schema exports must match the Zod source of truth.
      #    A stale export means external consumers are reading a model the
      #    platform no longer implements.
      - name: Canonical schema exports are current
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm schemas:check

      - name: OpenAPI contract is current
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm openapi:check

      - name: Cloudflare topology is internally consistent
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm cloudflare:topology:check

      # 5. Vertical configuration. Validates every verticals/* declaration:
      #    required docs present, vertical.yaml well-formed, and every source
      #    carries complete rights metadata (AGENTS.md rule 1). No-ops cleanly
      #    while verticals/ does not yet exist.
      - name: Vertical config validation
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm verticals:validate

      # 6. The edge runtime artifact must match the vertical config it was
      #    compiled from. The Worker has no filesystem and reads the committed
      #    JSON, so a stale artifact means the deployed surface is serving a
      #    filter and fact-selection policy the repository no longer declares —
      #    invisible at review time, because the YAML looks right.
      - name: Vertical runtime artifacts are current
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm verticals:compile:check

      - name: Acquisition runtime artifacts are current
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm acquisition:check

      # 7. MCP advertises the same six executable generic tools implemented by
      #    apps/mcp, plus compiled vertical query/server metadata. Drift would
      #    make the remote server advertise a contract it does not execute.
      - name: MCP runtime artifacts are current
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm mcp:compile:check

      # 8. Same reasoning as step 6, for the web surface's own compiled
      #    artifact — it additionally bundles seo.yaml, which the edge runtime
      #    artifact does not carry.
      - name: Web runtime artifacts are current
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm web:compile:check

      # 9. Build the exact Cloudflare bundles only after every generated input
      #    is known current, then reject any production artifact that carries
      #    the local PGlite/WASM runtime.
      - name: Cloudflare production artifacts are deployable and PGlite-free
        if: needs.scope.outputs.run_verify == 'true'
        run: pnpm cloudflare:artifacts:check

  migrations-postgres:
    name: migrations on real Postgres
    needs: scope
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.scope.result != 'success' || needs.scope.outputs.run_postgres == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fail when scope selection fails
        if: always() && needs.scope.result != 'success'
        run: |
          echo "Scope selection failed; real-Postgres requirements cannot be determined." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Keep the disposable Postgres proof structurally equivalent to the
      # hosted direct path: a job-local CA, certificate-verified TLS, and an
      # HBA that rejects non-TLS TCP. No plaintext fallback is added to source.
      - name: Start disposable TLS PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          container_name='data-foundry-postgres-tls'
          startup_stage='not-classified'
          classify_startup_failure() {
            local startup_output="${1:-}"
            local container_state='not-created'
            local category="$startup_stage"

            if docker container inspect "$container_name" >/dev/null 2>&1; then
              container_state="$(docker container inspect --format '{{.State.Status}}' "$container_name" 2>/dev/null || true)"
              case "$container_state" in
                created|running|exited) ;;
                *) container_state='not-created' ;;
              esac
            fi

            if printf '%s' "$startup_output" | grep -Eqi 'Conflict.*container name|is already in use'; then
              category='container-name-conflict'
            elif printf '%s' "$startup_output" | grep -Eqi 'port is already allocated|address already in use'; then
              category='port-conflict'
            elif printf '%s' "$startup_output" | grep -Eqi 'pull access denied|failed to resolve reference|manifest unknown|unable to find image'; then
              category='image-pull'
            elif [ "$container_state" != 'not-created' ] && docker logs "$container_name" 2>&1 | grep -Eqi 'could not load (private key|server certificate)|permission denied.*(/tls|server\.(key|crt))|(/tls|server\.(key|crt)).*permission denied'; then
              category='tls-file-access'
            fi

            printf 'data-foundry-ci-postgres-startup: state=%s category=%s\n' "$container_state" "$category"
          }
          on_startup_error() {
            local status=$?
            trap - ERR
            classify_startup_failure ''
            exit "$status"
          }
          trap 'on_startup_error' ERR

          startup_stage='tls-directory'
          tls_dir="$(mktemp -d "$RUNNER_TEMP/data-foundry-postgres-tls.XXXXXX")"
          chmod 755 "$tls_dir"
          startup_stage='certificate-generation'
          openssl req -x509 -new -nodes -newkey rsa:2048 -days 1 \
            -keyout "$tls_dir/ca.key" \
            -out "$tls_dir/ca.crt" \
            -subj '/CN=data-foundry-ci-ca' >/dev/null 2>&1
          cat > "$tls_dir/server.cnf" <<'EOF'
          [req]
          prompt = no
          distinguished_name = dn
          req_extensions = req_ext
          [dn]
          CN = localhost
          [req_ext]
          subjectAltName = @alt_names
          [alt_names]
          DNS.1 = localhost
          IP.1 = 127.0.0.1
          EOF
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout "$tls_dir/server.key" \
            -out "$tls_dir/server.csr" \
            -config "$tls_dir/server.cnf" >/dev/null 2>&1
          openssl x509 -req -days 1 -sha256 \
            -in "$tls_dir/server.csr" \
            -CA "$tls_dir/ca.crt" \
            -CAkey "$tls_dir/ca.key" \
            -CAcreateserial \
            -out "$tls_dir/server.crt" \
            -extfile "$tls_dir/server.cnf" \
            -extensions req_ext >/dev/null 2>&1
          startup_stage='tls-key-owner'
          sudo chown 999:999 "$tls_dir/server.key"
          startup_stage='tls-key-mode'
          chmod 600 "$tls_dir/server.key"
          cat > "$tls_dir/pg_hba.conf" <<'EOF'
          local   all             all                                     trust
          hostssl all             all             0.0.0.0/0               scram-sha-256
          hostnossl all          all             0.0.0.0/0               reject
          EOF
          startup_stage='credential-generation'
          postgres_password="$(openssl rand -hex 24)"
          migration_password="$(openssl rand -hex 24)"
          startup_stage='docker-start'
          startup_output=''
          if ! startup_output="$(docker run --detach --name "$container_name" \
            --env POSTGRES_PASSWORD="$postgres_password" \
            --env POSTGRES_DB=data_foundry \
            --publish 5432:5432 \
            --volume "$tls_dir/server.crt:/tls/server.crt:ro" \
            --volume "$tls_dir/server.key:/tls/server.key:ro" \
            --volume "$tls_dir/pg_hba.conf:/tls/pg_hba.conf:ro" \
            postgres:16 \
            -c ssl=on \
            -c ssl_cert_file=/tls/server.crt \
            -c ssl_key_file=/tls/server.key \
            -c hba_file=/tls/pg_hba.conf 2>&1)"; then
            classify_startup_failure "$startup_output"
            exit 1
          fi
          startup_stage='readiness'
          ready='false'
          for attempt in $(seq 1 30); do
            if docker exec "$container_name" pg_isready -U postgres -d data_foundry >/dev/null 2>&1; then
              ready='true'
              break
            fi
            sleep 1
          done
          if [ "$ready" != 'true' ]; then
            classify_startup_failure "$startup_output"
            exit 1
          fi
          startup_stage='environment-export'
          {
            printf 'NODE_EXTRA_CA_CERTS=%s\n' "$tls_dir/ca.crt"
            printf 'POSTGRES_URL=postgres://postgres:%s@localhost:5432/data_foundry\n' "$postgres_password"
            printf 'DATA_FOUNDRY_MIGRATION_DATABASE_URL=postgres://df_migration:%s@localhost:5432/data_foundry\n' "$migration_password"
            printf 'DATA_FOUNDRY_RELEASE_SHA=%s\n' "$GITHUB_SHA"
            printf 'DATA_FOUNDRY_CI_MIGRATION_PASSWORD=%s\n' "$migration_password"
          } >> "$GITHUB_ENV"
          trap - ERR

      # Supabase exposes installed extensions through this namespace. Model its
      # private ownership boundary: the direct migration login is a non-super
      # user and owns only the schema it will migrate.
      - name: Bootstrap narrow private migration role
        shell: bash
        run: |
          set -euo pipefail
          {
            cat <<'SQL'
          CREATE SCHEMA IF NOT EXISTS extensions AUTHORIZATION postgres;
          SQL
            printf "CREATE ROLE df_migration LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD '%s';\n" "$DATA_FOUNDRY_CI_MIGRATION_PASSWORD"
            cat <<'SQL'
          CREATE SCHEMA IF NOT EXISTS data_foundry AUTHORIZATION df_migration;
          REVOKE ALL ON SCHEMA data_foundry FROM PUBLIC;
          GRANT CONNECT, CREATE ON DATABASE data_foundry TO df_migration;
          GRANT USAGE ON SCHEMA extensions TO df_migration;
          SQL
          } | docker exec --interactive data-foundry-postgres-tls psql -U postgres -d data_foundry -v ON_ERROR_STOP=1

      # The same SQL, unchanged, against a real Postgres. This is the check that
      # keeps "portable Postgres DDL" honest rather than aspirational.
      - name: Apply migrations to Postgres
        run: pnpm migrate

      - name: Re-apply must be a no-op
        run: pnpm migrate

      # This deliberately uses independent PostgreSQL connections and waits for
      # the advisory transaction lock, so the reconciliation race cannot hide
      # behind the single-connection PGlite scheduler.
      - name: Source-record reconciliation concurrency regression
        env:
          DATA_FOUNDRY_POSTGRES_CONCURRENCY_TEST: '1'
        run: pnpm source-records:postgres:check

      - name: Credential provisioning concurrency regression
        env:
          DATA_FOUNDRY_POSTGRES_CONCURRENCY_TEST: '1'
        run: pnpm credentials:postgres:check

      - name: Scheduled acquisition concurrency and transaction controls
        run: pnpm acquisition:postgres:check
