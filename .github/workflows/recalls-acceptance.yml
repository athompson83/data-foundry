name: Recalls production acceptance

# Bounded, authenticated acceptance of the live recalls API (FDA Recall
# Intelligence and North American Consumer Product Recalls) through the normal
# customer authentication path. apps/recalls-worker/scripts/acceptance.ts
# issues one key for the internal acceptance customer through the operator
# reissue path, runs about fifteen metered requests, always revokes the key,
# and proves it is rejected. The key is never printed; the evidence (job log and
# step summary) holds statuses, ids, counts and digests only. Manual and environment-protected;
# never runs on push, pull_request or a schedule.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: accept-recalls'
        required: true
        type: string
      expected_sha:
        description: 'Full 40-character main commit SHA that the deploy workflow put live'
        required: true
        type: string
      stripe_customer_id:
        description: 'Internal acceptance customer (cus_acceptance_internal_YYYYMMDD)'
        required: true
        default: cus_acceptance_internal_20260928
        type: string

permissions:
  contents: read

concurrency:
  # The production deployment lock: no deploy can change the serving version mid-run, and
  # two acceptance runs never reissue the same customer's key at once. The script also
  # re-reads the live version after its checks.
  group: deploy-production
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  accept:
    name: authenticated acceptance • revoke • evidence
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Require the confirmation phrase and an internal customer id
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          CUSTOMER: ${{ inputs.stripe_customer_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ADMIN_TOKEN: ${{ secrets.RECALLS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "accept-recalls" ]] || { echo "The confirm input must be exactly accept-recalls." >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_sha must be a full 40-character commit SHA." >&2; exit 1; }
          [[ "$CUSTOMER" =~ ^cus_acceptance_internal_[0-9]{8}$ ]] || { echo "Only an internal acceptance customer may be used." >&2; exit 1; }
          if [[ ${#ADMIN_TOKEN} -lt 32 ]]; then
            echo "::error::RECALLS_ADMIN_TOKEN (the Worker's ADMIN_TOKEN) is not set for the production environment."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Accept the commit that is live, with that commit's own script: it must be on main, and
      # the script refuses to issue a key unless the live Worker version is tagged with it.
      - name: Check out the deployed commit, which must be on main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_SHA" "$GITHUB_SHA" || { echo "$EXPECTED_SHA is not on main." >&2; exit 1; }
          git checkout --quiet --detach "$EXPECTED_SHA"

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run acceptance (the key stays inside this process)
        env:
          ADMIN_TOKEN: ${{ secrets.RECALLS_ADMIN_TOKEN }}
          ACCEPTANCE_STRIPE_CUSTOMER_ID: ${{ inputs.stripe_customer_id }}
          ACCEPTANCE_EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACCEPTANCE_EVIDENCE_FILE: ${{ runner.temp }}/recalls-acceptance.json
        run: pnpm exec tsx apps/recalls-worker/scripts/acceptance.ts

      - name: Evidence summary
        if: always()
        shell: bash
        run: |
          file="$RUNNER_TEMP/recalls-acceptance.json"
          [[ -f "$file" ]] || { echo "No evidence was written." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          node -e '
            const e = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const rows = e.checks.map((c) => `| ${c.ok ? "pass" : "FAIL"} | ${c.name} | ${String(c.detail).replace(/\|/g, "/")} |`);
            console.log([`## Recalls acceptance: ${e.ok ? "PASSED" : "FAILED"}`, "", `Source commit \`${e.source_sha}\`, live version \`${e.live_version.version_id}\` (tag \`${e.live_version.tag}\`), ${e.started_at} to ${e.finished_at}, key prefix \`${e.key_prefix}\`, ${e.metered_requests} metered requests.`, "", "| Result | Check | Detail |", "| --- | --- | --- |", ...rows].join("\n"));
          ' "$file" >> "$GITHUB_STEP_SUMMARY"
