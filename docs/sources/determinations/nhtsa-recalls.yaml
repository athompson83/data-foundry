surfaces:
  PUBLIC_WEB:
    decision: ALLOW
    rationale: >-
      § 105 federal work with no contrary restriction; pages render the NHTSA
      attribution and "not endorsed by NHTSA or the U.S. Department of
      Transportation" disclaimer. Indexability remains quality-gated.
  SEARCH_INDEX:
    decision: ALLOW
    rationale: >-
      § 105 federal work; search indexing of attributed recall pages is
      permitted. seo.yaml's quality gates still decide which pages are indexable.
  API_FREE:
    decision: ALLOW
    rationale: § 105 federal work; no licence, key or usage restriction on the flat files.
  API_PAID:
    decision: ALLOW
    rationale: >-
      § 105 federal work; commercial redistribution of normalized recall facts
      is not restricted. Attribution and disclaimer travel with every response.
  RAPIDAPI:
    decision: ALLOW
    rationale: >-
      No licence exists that could forbid sublicensing through a marketplace;
      § 105 places the data in the public domain in the United States.
  MCP:
    decision: ALLOW
    rationale: § 105 federal work; agent retrieval is redistribution on the same terms as the API.
  BULK_EXPORT:
    decision: ALLOW
    rationale: >-
      NHTSA itself publishes the complete file; § 105 permits bulk
      redistribution of the normalized derivative with attribution.
internal_processing:
  ACQUIRE:
    decision: ALLOW
    rationale: >-
      Unauthenticated public download from the agency bucket; no robots.txt is
      published on static.nhtsa.gov; one GET per refresh.
  STORE:
    decision: ALLOW
    rationale: Retaining the agency file as evidence (AGENTS.md rule 10) is unrestricted for a § 105 work.
  CACHE:
