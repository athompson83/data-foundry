    sources: [https://clinicaltrials.gov/api/v2/studies/download?format=json.zip, https://clinicaltrials.gov/api/v2/studies]
    scores: { agent_demand: 4, rights_clarity: 3, acquisition_ease: 5, structuring_value: 4, freshness: 5, low_onboarding_cost: 3, poor_existing_access: 3 }
    terms:
      - url: https://clinicaltrials.gov/about-site/terms-conditions
        quote: "Update the data such that they are current at all times"
      - url: https://clinicaltrials.gov/about-site/terms-conditions
        quote: "You shall not assert any proprietary rights to any portion of the database, or represent the database or any part thereof to anyone as other than a United States Government database."
    evidence: [docs/sources/pipeline/research-2026-09-27.md]
    conditions:
      - Attribute ClinicalTrials.gov; show the source processing date and our modifications.
