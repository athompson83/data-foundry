datasets:
  - key: home-product-recalls-global
    name: Global home-equipment and consumer-product recall register (multi-agency, model/GTIN-linked)
    category: product-safety
    entity: recall_notice (one agency notice) grouped into recall_event clusters, each linked to affected products
      (brand, model / model pattern, serial range, GTIN, lot)
    stage: SCREENED
    description: "One record per regulator notice from CPSC (US), Health Canada (CA), EU Safety Gate, UK OPSS,
      ACCC (AU) and MBIE (NZ), extending the LIVE fda-recalls StructuredRecall pipeline. Free text is parsed
      deterministically into model numbers, serial ranges, GTINs, units, sale periods, hazards and remedies.
      A cited Safety Gate case number is the only automatic event link: it merges notices into one
      recall_event. A check-digit-valid GTIN links each notice automatically to the affected product, but
      never merges events, because one product can be recalled twice for different defects; notices that
      share only a GTIN become a reviewed event candidate. The joint-recall marker, title tokens and
      brand + model within a date window only enqueue candidate links for review. Enrichment with the ENERGY
      STAR model a notice names and with SaferProducts.gov incident counts on the same brand + model is
      likewise a reviewed candidate link, except where a check-digit-valid GTIN matches. Every fact carries
      its source notice; disagreements are kept per source, never averaged."
    sources:
      - cpsc-recalls
      - appliance-recall-model-index
      - hvac-cpsc-recall-slice
      - plumbing-water-heating-recalls
      - electrical-cpsc-recalls-facet
      - appliance-health-canada-recalls
      - eu-safety-gate-alerts
      - uk-opss-product-safety-alerts
      - au-accc-product-recalls
      - nz-mbie-product-recalls
      - appliance-saferproducts-incidents
      - appliance-energy-star-registry
      - plumbing-energystar-water-heaters
      - appliance-brand-ownership
    join_keys:
      - key: joint-recall marker ("Joint recall with ... CPSC" in the HC OGL field) + date within 45 days +
          at least 2 shared distinctive title tokens
        between:
          - appliance-health-canada-recalls
          - cpsc-recalls
        measured: 341/352 HC joint notices matched as candidates (337 unambiguous); 25/25 correct on hand check
        mode: candidate
        reviewed: { correct: 25, checked: 25 }
      - key: title-token match WITHOUT the joint marker (candidate only, never auto-linked)
        between:
          - appliance-health-canada-recalls
          - cpsc-recalls
        measured: 238/863 non-joint HC consumer notices since 2022 match; 6/15 correct on hand check
        mode: candidate
      - key: joint-recall marker, home-equipment facets
        between:
          - cpsc-recalls
          - appliance-health-canada-recalls
        measured: 43/138 CPSC home-equipment recalls since 2022
        mode: candidate
      - key: normalised brand + model within 365 days
        between: &a5
          - uk-opss-product-safety-alerts
          - eu-safety-gate-alerts
        measured: 79/697 UK home-category notices by brand + model alone, with brand evidence only from a real
          brand field (uk_eu_separate.py on the archived intl_recs.json; screening reported 118, which also counted
          GTIN-only matches and title words used as brands); 137/697 with model only, no brand check (was 149);
          hand check 19/20 on a seeded sample of the 79 (1 uncertain, brand evidence only the word "Li-ion")
        mode: candidate
        reviewed: { correct: 19, checked: 20 }
      - key: exact GTIN with a valid GS1 check digit, within 365 days (links the notice to the same product;
          never merges recall events)
        between: *a5
        measured: 24/697 UK home-category notices (29 before check-digit validation; 5 matched codes fail the GS1
          check); re-measured from the archived intl_recs.json by gtin_validated.py
        mode: declared
      - key: normalised brand + model within 365 days
        between: &a6
          - cpsc-recalls
          - eu-safety-gate-alerts
        measured: 0/88 CPSC home-equipment recalls with model tokens (2023-01..2026-09); 11/861 across all CPSC
          products
        mode: candidate
      - key: exact GTIN with a valid GS1 check digit, within 365 days (links the notice to the same product;
          never merges recall events)
        between: *a6
        measured: "0/861 CPSC recalls with model or code tokens (xmatch.py with CPSC UPC fields tokenized and check-digit validated: via GTIN 0; 864 before)"
        mode: declared
      - key: normalised brand + model within 365 days
        between: &a7
          - cpsc-recalls
          - uk-opss-product-safety-alerts
        measured: 0/119 CPSC home-equipment recalls (2021-01..2026-09); 14/1126 across all CPSC products vs UK home
          categories; 8/8 correct on hand check
        mode: candidate
      - key: exact GTIN with a valid GS1 check digit, within 365 days (links the notice to the same product;
          never merges recall events)
        between: *a7
        measured: "0/1126 CPSC recalls vs UK home categories (xmatch.py, tokenized CPSC UPCs: via GTIN 0; 1130 before)"
        mode: declared
      - key: normalised brand + model within 365 days
        between: &a8
          - au-accc-product-recalls
          - cpsc-recalls
        measured: 4/36 ACCC notices with model/GTIN (May-Sep 2026) match a CPSC recall; 3/4 confirmed on hand check;
          0/9 CPSC home recalls in the window
        mode: candidate
        reviewed: { correct: 3, checked: 4 }
      - key: exact GTIN with a valid GS1 check digit, within 365 days (links the notice to the same product;
          never merges recall events)
        between: *a8
        measured: "0/36 ACCC notices (xmatch_out: via GTIN 0)"
        mode: declared
      - key: normalised model token + brand/manufacturer token overlap
        between:
          - cpsc-recalls
          - appliance-saferproducts-incidents
        measured: 111/307 CPSC home recalls since 2011-03 with model tokens have >=1 matching incident report (screening
          run before the generic-model denylist; 3 of the 111 match only on generic tokens and 2 more may, so 106-108/307; 1,137
          reports); 50/111 have a report dated before the recall; 11/12 correct on hand check
        mode: candidate
      - key: normalised model (ENERGY STAR wildcard pattern expansion) + brand token overlap
        between:
          - cpsc-recalls
          - appliance-energy-star-registry
        measured: 6/230 CPSC home recalls since 2015 with model tokens (7/230 without the brand check); a lower bound,
          measured with one-character wildcards before the zero-or-one grammar was applied
        mode: candidate
      - key: exact GTIN-13 / UPC with a valid GS1 check digit
        between:
          - cpsc-recalls
          - appliance-energy-star-registry
        measured: 0/87 CPSC home-recall UPCs; 0/8,399 EU GTINs; 0/93 UK GTINs match an ENERGY STAR UPC
        mode: declared
    taxonomy:
      - "jurisdiction: US | CA | EU (+ notifying member state) | GB | AU | NZ"
      - "agency: CPSC | HC | EC-SafetyGate | OPSS | ACCC | MBIE"
      - "notice_type: recall | recall-alert | safety-report (no recall) | safety-alert | warning | withdrawal
