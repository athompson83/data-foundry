  - key: aviation-safety-events
    name: US aviation accident/incident and airworthiness-action register (NTSB + FAA)
    category: transport
    entity: aircraft_model (one make + model designation, e.g. "Cessna 182"), with its NTSB accident/incident
      history and the FAA airworthiness/special-conditions actions that have named it (published, not verified
      still in effect — see the aviation make/model join_keys.measured note) as per-model facts from two
      independent federal publishers
    stage: SCREENED
    description: "A Codex review on PR #72 correctly rejected an earlier version of this entry: NTSB publishes
      accident/incident records (an investigated event) and Federal Register publishes regulatory actions (an
      airworthiness directive), which are not the same entity type — describing 'one record per NTSB accident
      or FAA action' as a single entity, per member, does not satisfy this pipeline's composite definition
      (README: a dataset is one entity type assembled from several sources). The entity is instead the
      aircraft model itself: NTSB contributes which models appeared in which investigated accidents/incidents
      (aircraft, event, flight-crew and narrative facts from the monthly eADMSPUB extract, keyed by
      make+model), and Federal Register contributes which models have been named in a published airworthiness
      or special-conditions action (keyed the same way; a Codex review on PR #72 found the join does not
      verify whether that action remains in effect, only that the model was named in one — see
      join_keys.measured). No declared identifier links a specific accident to a
      specific directive (an accident names a tail number; a directive names a model, never a tail number), so
      the make/model key is a reviewed candidate link only, never an automatic merge (AGENTS.md rules 3 and
      7): it tells an agent that a model involved in a real accident has also been named in a published
      FAA safety filing (not that it currently has an open, still-in-effect one — see join_keys.measured),
      and not that any specific accident caused any specific directive."
    sources:
      - ntsb-aviation-accidents
      - faa-airworthiness-directives
    join_keys:
      - key: aircraft make/model token (candidate only, never auto-linked)
        between:
          - ntsb-aviation-accidents
          - faa-airworthiness-directives
        measured: "5/5 of a hand-picked reviewed sample confirmed the same manufacturer+model is named, exactly
          or by an exact model-series match, in a Federal Register FAA airworthiness/special-conditions
          filing, checked against every result of a live Federal Register FAA-agency query fetched in full
          (per_page=1000, no next_page_url left on any of the five queries — a Codex review on PR #72 found
          the prior evidence run had cached only each query's first default-size page, e.g. 3 of 890 Boeing
          737 results, and reported an incomplete search as a confirmed negative; every query is now
          exhaustively fetched in one page). This measures whether the model has been named in such a filing,
          not whether that specific action is presently in effect (a Codex review on PR #72 found the join
          does not check for a later superseding, rescinding or corrected action, so 'currently subject to'
          is not a claim this measurement supports; see next_action and the taxonomy's record_type field, not
          agent_questions, for the honest scope). Textron 560XL, Robinson R44, Cessna 182 and Airbus A319-114
          matched exactly — the A319-114 match is document 2026-17551, a sub-variant list further down the
          result set. Boeing 737-7CT, initially reported as a confirmed negative, is also a match once
          corrected: a Codex review on PR #72 found '7CT' is a Boeing customer code (airline-specific, e.g.
          for one operator's fleet), not a model series, and the FAA writes directives against the series
          (737-700) that the customer code's leading digit denotes, never the customer code itself; document
          2025-20951 names '737-700' exactly (this normalization is applied only when the NTSB record's make
          is Boeing, per a further Codex review — the same digit-plus-two-character suffix shape also occurs
          on non-Boeing designations in this sample, e.g. Schweizer SGS 2-33A, Enstrom F-28F, Bell OH-58A,
          which are not Boeing customer codes and must not be series-normalized). This
          5-record sample is drawn from, but not representative of, the
          round's 163 NTSB aircraft records (July 2026 monthly update); the other 158 were never queried and
          are not counted as non-matches."
        mode: candidate
        reviewed: { correct: 5, checked: 5 }
    taxonomy:
      - "record_type: accident | incident | airworthiness_directive | special_conditions"
      - "publisher: NTSB | FAA (via Federal Register)"
      - "aircraft_category: airplane | helicopter | glider | other"
      - "injury_severity: fatal | serious | minor | none (NTSB ev_highest_injury)"
    agent_questions:
      - Has this aircraft model (by manufacturer and model designation) been involved in an NTSB-investigated
        accident, and has it been named in an FAA airworthiness or special-conditions filing (named in, not
        verified still in effect; see join_keys.measured)?
      - What is the probable cause or finding narrative for accidents involving this aircraft make/model in
        the last month?
      - Which aircraft models named in a Federal Register FAA airworthiness or special-conditions filing have
        also had a recent NTSB accident or incident?
    scores:
      agent_demand: 4
      rights_clarity: 3
      acquisition_ease: 4
      structuring_value: 3
      freshness: 4
      low_onboarding_cost: 3
      poor_existing_access: 3
    evidence:
      - docs/sources/pipeline/research-2026-09-28.md
      - docs/sources/pipeline/evidence/2026-09-28/aviation
    next_action: >-
      Write the ADR-0013 rights records for both members from a readable terms citation (neither ntsb.gov nor
      federalregister.gov/govinfo.gov returned readable policy text to a plain HTTP GET this round; the basis
      is otherwise the well-established US-government-work status of NTSB and Federal Register content).
      Then pull a full monthly NTSB update plus a broader Federal Register manufacturer/model sweep (not just
      the 5 models hand-checked this round) for a proper EVIDENCED sample under evidence/<date>/. The
