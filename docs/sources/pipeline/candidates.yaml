datasets:
  - key: home-product-recalls-global
    name: Global home-equipment and consumer-product recall register (multi-agency, model/GTIN-linked)
    category: product-safety
    entity: recall_notice (one agency notice) grouped into recall_event clusters, each linked to affected products
      (brand, model / model pattern, serial range, GTIN, lot)
    stage: SCREENED
    description: "One record per regulator notice from CPSC (US), Health Canada (CA), EU Safety Gate, UK OPSS,
      ACCC (AU) and MBIE (NZ), extending the LIVE fda-recalls StructuredRecall pipeline. Free text is parsed
      deterministically into model numbers, serial ranges, GTINs, units, sale periods, hazards and remedies.
      A cited Safety Gate case number is the only automatic event link: it merges notices into one
      recall_event. A check-digit-valid GTIN links each notice automatically to the affected product, but
      never merges events, because one product can be recalled twice for different defects; notices that
      share only a GTIN become a reviewed event candidate. The joint-recall marker, title tokens and
      brand + model within a date window only enqueue candidate links for review. Enrichment with the ENERGY
      STAR model a notice names and with SaferProducts.gov incident counts on the same brand + model is
      likewise a reviewed candidate link, except where a check-digit-valid GTIN matches. Every fact carries
      its source notice; disagreements are kept per source, never averaged."
    sources:
      - cpsc-recalls
      - appliance-recall-model-index
      - hvac-cpsc-recall-slice
      - plumbing-water-heating-recalls
      - electrical-cpsc-recalls-facet
      - appliance-health-canada-recalls
      - eu-safety-gate-alerts
