          never merges recall events)
        between: *a5
        measured: 24/697 UK home-category notices (29 before check-digit validation; 5 matched codes fail the GS1
          check); re-measured from the archived intl_recs.json by gtin_validated.py
        mode: declared
      - key: normalised brand + model within 365 days
        between: &a6
