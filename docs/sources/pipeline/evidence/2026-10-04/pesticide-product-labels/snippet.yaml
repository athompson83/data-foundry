candidates:
  - key: pesticide-epa-ppis
    name: EPA Pesticide Product Information System (PPIS) weekly ASCII files (FIFRA Section 3 products, formulations, CAS crosswalk)
    category: chemical-safety
    structuring: normalization
    format: structured
    publisher: US EPA Office of Pesticide Programs
    stage: SCREENED
    rights: AMBER
    sources: [ 'https://www.epa.gov/ingredients-used-pesticide-products/ppis-download-product-information-data', 'https://www3.epa.gov/pesticides/PPISdata/product.zip', 'https://www3.epa.gov/pesticides/PPISdata/formula.zip', 'https://www3.epa.gov/pesticides/PPISdata/chemcas.zip' ]
    scores: { agent_demand: 4, rights_clarity: 3, acquisition_ease: 4, structuring_value: 4, freshness: 5, low_onboarding_cost: 4, poor_existing_access: 3 }
    terms:
      - url: https://www.epa.gov/web-policies-and-procedures/epa-disclaimers
        quote: 'These documents may be freely distributed and used for non-commercial, scientific and educational purposes. Commercial use of the documents available from the EPA websites may be protected under the U.S. and Foreign Copyright Laws.'
    conditions:
      - 'The EPA disclaimer reserves commercial-use copyright for some documents; PPIS rows are EPA-authored registration facts (registration number, product name, status, approval date, active-ingredient code and percentage, CAS), so serve only those fields and resolve the commercial-use wording in an ADR-0013 rights record.'
      - 'Fixed-width ASCII with no label text: product names and company names are registrant-supplied; exclude company contact fields (company.txt carries personal contact names and phone numbers) from publication.'
      - 'Files are refreshed every Tuesday (EPA page); archive each snapshot in R2 and record the file date so freshness is never overstated.'
    evidence: [ docs/sources/pipeline/research-2026-10-04.md, docs/sources/pipeline/evidence/2026-10-04/pesticide-product-labels/notes.md ]
    next_action: Write the ADR-0013 rights record for PPIS, parse product/formula/chemcas/chemname/prodsite/prodpest into typed records keyed by registration number and PC_CODE, and archive the weekly zips in R2.

  - key: pesticide-pmra-ppid
    name: Health Canada PMRA Pesticide Product Information Database (daily CSV extracts, OGL-Canada)
    category: chemical-safety
    structuring: normalization
    format: structured
    publisher: Health Canada Pest Management Regulatory Agency
    stage: SCREENED
    rights: AMBER
    sources: [ 'https://open.canada.ca/data/en/dataset/e10b0d6e-04ac-4014-a64a-666c3874bbe0', 'https://pest-control.canada.ca/pesticide-registry-api/api/extract/product', 'https://pest-control.canada.ca/pesticide-registry-api/api/extract/ingredient' ]
    scores: { agent_demand: 4, rights_clarity: 5, acquisition_ease: 5, structuring_value: 4, freshness: 5, low_onboarding_cost: 5, poor_existing_access: 3 }
    terms:
      - url: https://open.canada.ca/en/open-government-licence-canada
        quote: 'The Information Provider grants you a worldwide, royalty-free, perpetual, non-exclusive licence to use the Information, including for commercial purposes, subject to the terms below.'
    conditions:
      - 'Open Government Licence - Canada: include the attribution statement and do not suggest official status or endorsement by the Information Provider.'
      - 'Extracts are Windows-1252 CSV (bilingual); decode explicitly. Historical products carry placeholder text for missing active ingredients; filter on the Current / Historical column.'
      - 'The label extract lists only registration number, registrant, product name and status (no label text); label PDFs are not bulk-served, so use-direction text must come from the Sites of Use and Pests fields until a label source is acquired.'
    evidence: [ docs/sources/pipeline/research-2026-10-04.md, docs/sources/pipeline/evidence/2026-10-04/pesticide-product-labels/notes.md ]
    next_action: Write the ADR-0013 rights record (OGL-Canada attribution), ingest the product, ingredient, application and mrl extracts nightly keyed by registration number and CAS, and probe the registry for label PDF URLs.

