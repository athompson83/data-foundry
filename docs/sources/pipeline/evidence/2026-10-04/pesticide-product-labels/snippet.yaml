    terms:
      - url: https://creativecommons.org/licenses/by/3.0/au/
        quote: 'Share — copy and redistribute the material in any medium or format for any purpose, even commercially.'
    conditions:
      - 'CC BY 3.0 AU: attribute the APVMA, link the licence and indicate changes. The licence is declared in data.gov.au metadata for the dataset; the PubCRIS portal copyright page returned HTTP 404 from the guessed URL, so confirm the portal notice in the rights record.'
