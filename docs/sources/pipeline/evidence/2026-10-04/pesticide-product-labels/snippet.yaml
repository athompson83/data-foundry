datasets:
  - key: pesticide-product-labels
    name: Registered pesticide products with active ingredients, CAS numbers and use sites (US, Canada, Australia)
    category: chemical-safety
    entity: pesticide_product (one registered product per national registration number) with active ingredients, CAS numbers, registration status and use sites or pests
    stage: SCREENED
    description: 'One record per registered pesticide product from the US EPA (PPIS), Health Canada PMRA (PPID) and the APVMA (PubCRIS), linked to chemicals by the active ingredient CAS number. EPA names a CAS number per active-ingredient code (983 of 1220 codes in active-product formulations carry one) and PMRA lists a CAS number per active ingredient (943 of 1315); 641 CAS numbers appear in both. The label-text member (EPA PPLS accepted-label PDFs) is parked until a bulk or stable PDF route is found, so the composite has no free-text member yet and cannot advance to EVIDENCED.'
    sources: [ pesticide-epa-ppis, pesticide-pmra-ppid, pesticide-apvma-pubcris ]
    join_keys:
      - key: CAS number (EPA PC_CODE to CAS crosswalk against PMRA ingredient CAS number)
        between: [ pesticide-epa-ppis, pesticide-pmra-ppid ]
        measured: '641/1069 EPA active-ingredient CAS numbers (all PC_CODEs in Section 3 active-product formulations that carry a CAS) also appear among the 943 PMRA ingredient CAS numbers (641/943); hand-check of 25 sampled pairs: all 25 name the same substance, 3 differ in how mixture composition is described'
        mode: declared
      - key: active ingredient name (PMRA ingredient list against APVMA constituent list, exact after removing punctuation and case)
        between: [ pesticide-pmra-ppid, pesticide-apvma-pubcris ]
        measured: '418/1315 PMRA ingredient names equal an APVMA constituent name after normalisation; APVMA constituents carry no CAS number'
        mode: candidate
        reviewed: { correct: 20, checked: 20 }
    taxonomy:
      - 'Pesticide type (insecticide, herbicide, fungicide, rodenticide, disinfectant, biopesticide)'
      - 'Registration status (registered, conditionally registered, cancelled, historical)'
      - 'Use site category and target pest'
      - 'Active ingredient by CAS number and chemical group'
      - 'Restricted-use classification (EPA RUP flag)'
    agent_questions:
      - 'Which registered pesticide products in the US and Canada contain this active ingredient (by CAS number) and what is each product status?'
      - 'Is this active ingredient registered in all three jurisdictions, and what products carry it in each?'
      - 'Which active products are restricted use in the US and what are their registration numbers and approval dates?'
    scores: { agent_demand: 4, rights_clarity: 3, acquisition_ease: 4, structuring_value: 4, freshness: 5, low_onboarding_cost: 4, poor_existing_access: 3 }
    evidence: [ docs/sources/pipeline/research-2026-10-04.md, docs/sources/pipeline/evidence/2026-10-04/pesticide-product-labels/notes.md ]
    next_action: Find a bulk or stable-URL route to the EPA PPLS label PDFs (the free-text member), write ADR-0013 rights records for PPIS, PPID and PubCRIS, and extend the CAS link to the chemical-hazard-classifications dataset (86 of 1069 EPA CAS numbers appear in the NIOSH index).
