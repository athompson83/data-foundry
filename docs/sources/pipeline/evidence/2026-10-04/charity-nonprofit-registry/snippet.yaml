datasets:
  - key: charity-nonprofit-registry
    name: Charity and nonprofit registry (multi-country regulator registers with purposes, activities and finances)
    category: regulatory
    entity: A registered charity or tax-exempt nonprofit with its national identifier, status, purposes, activities and finances, linked to affiliated organisations in other countries
    stage: SCREENED
    description: >-
      One record per registered charity assembled from the Australian ACNC register, the Canada Revenue Agency
      List of charities, the Charity Commission for England and Wales extract and the IRS Exempt Organizations
      master file with Form 990 XML. Each regulator keys on its own national identifier and none cites another's, so
      no declared cross-country join exists. Website domain is the strongest candidate key and links affiliate
      charities of the same international parent (separate legal entities, so a reviewed affiliate-of link, never a
      merge). Prose purposes and activities come from CRA program descriptions, UK charity_activities and 990 mission text.
    sources:
      - charity-acnc-register-au
      - charity-cra-list-of-charities-ca
      - charity-uk-charity-commission-register
      - charity-irs-teos-eo-bmf-990
    join_keys:
      - key: website domain (ACNC vs CRA)
        between: [ charity-acnc-register-au, charity-cra-list-of-charities-ca ]
        measured: '36/34371 CRA charity website rows share a non-platform host with an ACNC charity website (46 before dropping facebook, google and similar hosts); hand-checked 29 of 36 as the same named organisation or national affiliate (wrong: shared bahai.org and jw.org local units, differently named charities).'
        mode: candidate
        reviewed: { correct: 29, checked: 36 }
      - key: website domain (ACNC vs UK)
        between: [ charity-acnc-register-au, charity-uk-charity-commission-register ]
        measured: '151/102495 UK registered charity websites share a non-platform host with an ACNC charity website (161 raw); hand-checked 124 of 151 as the same named organisation or national affiliate.'
        mode: candidate
        reviewed: { correct: 124, checked: 151 }
      - key: website domain (CRA vs UK)
        between: [ charity-cra-list-of-charities-ca, charity-uk-charity-commission-register ]
        measured: '59/34371 CRA charity website rows share a non-platform host with a UK registered charity website (66 raw); hand-checked 45 of 59 as the same named organisation or national affiliate.'
        mode: candidate
        reviewed: { correct: 45, checked: 59 }
      - key: exact normalised legal name (ACNC vs UK)
        between: [ charity-acnc-register-au, charity-uk-charity-commission-register ]
        measured: '820/64337 ACNC distinct normalised names equal a UK registered charity name; a random sample of 25 hand-checked 8 of 25 as the same organisation (the rest are generic names such as all saints church or hastings), so names alone are a weak candidate.'
        mode: candidate
        reviewed: { correct: 8, checked: 25 }
      - key: exact normalised legal name (IRS 990 filer sample vs UK)
        between: [ charity-irs-teos-eo-bmf-990, charity-uk-charity-commission-register ]
        measured: '15/1416 filer names in the first 8 MB of 2026_TEOS_XML_01A equal a UK registered charity name; hand-checked 2 of 15 as the same organisation (Love146, Variety the Children''s Charity).'
        mode: candidate
        reviewed: { correct: 2, checked: 15 }
      - key: exact normalised legal name (IRS 990 filer sample vs CRA)
        between: [ charity-irs-teos-eo-bmf-990, charity-cra-list-of-charities-ca ]
        measured: '12/1416 filer names in the first 8 MB of 2026_TEOS_XML_01A equal a CRA charity name; hand-checked 1 of 12 as the same organisation (The Mission of Tao-Confucianism).'
        mode: candidate
        reviewed: { correct: 1, checked: 12 }
    taxonomy:
      - jurisdiction (Australia, Canada, England and Wales, United States)
      - charitable purpose class (relief of poverty, education, health, religion, environment, animals, community, arts and culture)
      - beneficiary group (children, aged persons, people with disabilities, veterans, communities overseas)
      - legal form (company limited by guarantee, incorporated association, trust, CIO, 501(c)(3) public charity, private foundation)
      - registration status (registered, removed, revoked)
      - income band (ACNC size small/medium/large, UK income, IRS asset and income codes)
    agent_questions:
      - Is this organisation a registered charity in Australia, Canada, England and Wales or the United States, and what is its status and registration date?
      - What does the charity say it does (purposes, programs and activities), and what were its latest income and expenditure?
      - Which national affiliates of the same international charity are registered in other countries?
    scores:
      {
        agent_demand: 4,
        rights_clarity: 4,
        acquisition_ease: 4,
        structuring_value: 4,
        freshness: 4,
        low_onboarding_cost: 4,
        poor_existing_access: 3
      }
    evidence: [ docs/sources/pipeline/research-2026-10-04.md, docs/sources/pipeline/evidence/2026-10-04/charity-nonprofit-registry/notes.md ]
    next_action: Add OSCR, NZ Charities Services and the Irish register, measure purpose-class extraction from prose, and keep every affiliate link a reviewed candidate until a declared cross-border identifier is found.
