datasets:
  - key: medical-device-adverse-events
    name: Medical device adverse events and field safety actions (multi-regulator, product-code and cited-510(k)-linked)
    category: health
    entity: device_incident_report (one regulator report or notice) linked to the device model, product code, premarket clearance and manufacturer, with outcome, device problem and narrative-derived facts
    stage: SCREENED
    description: 'One record per regulator report or notice about a medical device problem: FDA MAUDE reports with manufacturer and user narratives (26.1 million reports), Health Canada coded incident records (327,430), and MHRA field safety notices. Free text is parsed deterministically into event type, patient outcome, device problem, model, catalogue and lot identifiers. A cited 510(k) K-number links a MAUDE report to its FDA clearance automatically (32 of 32 measured); Health Canada device IDs link incidents to the MDALL licence register. Catalogue-number, manufacturer plus model and trade-name matches across regulators only propose reviewed links, never merges. Every fact carries its source report; disagreements are kept per source.'
    sources:
      - fda-maude-device-adverse-events
      - hc-medical-device-incidents
      - mhra-device-field-safety-notices
      - hc-mdall-device-licences
      - fda-device-510k-pma-clearances
    join_keys:
      - key: cited premarket notification reference number (MAUDE pma_pmn_number holds a K-number) to FDA 510(k) k_number
        between:
          - fda-maude-device-adverse-events
          - fda-device-510k-pma-clearances
        measured: '32/32 distinct K-numbers cited in 300 recent MAUDE reports found in openFDA 510(k); same publisher, so not counted as independent'
        mode: declared
      - key: MAUDE UDI-DI as GTIN against Health Canada device identifier
        between:
          - fda-maude-device-adverse-events
          - hc-mdall-device-licences
        measured: '0/101 UDI-DI in recent MAUDE reports match any of 3,152,063 MDALL device identifiers (0/500 in a larger sample); MDALL holds catalogue numbers, only 261,520 of 1,550,527 normalised identifiers are GTIN-like'
        mode: declared
      - key: manufacturer name plus device model token (MHRA FSN to MAUDE model_number)
        between:
          - mhra-device-field-safety-notices
          - fda-maude-device-adverse-events
        measured: '20/36 MHRA FSN model tokens (122 entries parsed, 36 with a usable token) appear as MAUDE model_number; 19/20 correct on hand check (the miss: a different manufacturer name)'
        mode: candidate
        reviewed: { correct: 19, checked: 20 }
      - key: catalogue number token (MAUDE catalog_number to MDALL device identifier)
        between:
          - fda-maude-device-adverse-events
          - hc-mdall-device-licences
        measured: '62/196 recent MAUDE reports with a catalogue number of 6+ characters match an MDALL device identifier; 15/17 distinct product matches same product on hand check'
        mode: candidate
        reviewed: { correct: 15, checked: 17 }
      - key: exact trade name (HC incident device to MAUDE brand_name)
        between:
          - hc-medical-device-incidents
          - fda-maude-device-adverse-events
        measured: '21/40 recent Health Canada trade names have an exact MAUDE brand_name hit; 14/21 correct on hand check (UNKNOWN placeholders and generic names are wrong)'
        mode: candidate
        reviewed: { correct: 14, checked: 21 }
    taxonomy:
      - event_type (death, injury, malfunction, other)
      - device_problem and patient_problem (FDA and Health Canada coded terms, mapped to one list)
      - product_code and medical_specialty (FDA three-letter code, Health Canada 2-digit specialty prefix)
      - device_class (I to IV)
      - report_source (manufacturer, user facility, voluntary, foreign compiled)
      - safety_action (field safety notice, recall)
    agent_questions:
      - Which adverse events were reported for this device model, UDI or 510(k) clearance, and what did the manufacturer narrative say happened?
      - Has this device model been the subject of a field safety notice in the UK, and do FDA or Health Canada hold reports for the same model?
      - Which product codes show a rising count of death or injury reports in the last 12 months across both North American regulators?
      - Which cleared devices (by 510(k) K-number) have reports citing them, and what device problems recur?
    scores:
      {
        agent_demand: 5,
        rights_clarity: 4,
        acquisition_ease: 4,
        structuring_value: 5,
        freshness: 3,
        low_onboarding_cost: 4,
        poor_existing_access: 3
      }
    evidence: [ docs/sources/pipeline/research-2026-10-04.md ]
    next_action: 'Archive the openFDA MAUDE bulk files, the Health Canada extract.zip and the 618 MHRA FSN pages to R2, then re-measure the K-number, catalogue-number and trade-name links on the full files; the MDALL UDI-DI link is 0/101, so do not rely on it.'
