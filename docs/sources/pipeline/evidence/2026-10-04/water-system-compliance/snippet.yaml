datasets:
  - key: water-system-compliance
    name: Public water system compliance register (violations, enforcement actions and regulator orders)
    category: environment
    entity: public_water_system (one PWSID) with violation, enforcement_action, risk-assessment and regulator-order records
    stage: SCREENED
    description: "One record per public water system, keyed by the US PWSID. Violations and enforcement actions from US EPA SDWIS (with free-text enforcement comments that cite dockets and rules) are linked automatically by exact PWSID to the California State Water Board SAFER risk assessment, which carries failing/at-risk status and the reasons. Ontario's drinking water system orders and adverse incident records add provincial order prose (Order Summary) structured into typed requirements, but Ontario uses its own DWS number and does not yet link to the US members. Every fact carries its source; California and EPA data both originate in state SDWIS reporting, so agreement is not treated as independent corroboration."
    sources:
      - water-epa-sdwis-violations-enforcement
      - water-ca-swrcb-safer-risk-assessment
      - water-ontario-dws-orders-awqi
    join_keys:
      - key: exact PWSID (the cited public water system reference number, SAFER WATER_SYSTEM_NUMBER equals SDWIS pwsid)
        between:
          - water-ca-swrcb-safer-risk-assessment
          - water-epa-sdwis-violations-enforcement
        measured: 3190/3190 SAFER systems found among 18,607 California EPA SDWIS water systems (population equal for 2,241; 19/25 sampled SAFER primary-MCL flags have an EPA MCL record)
        mode: declared
    taxonomy:
      - 'violation category: MCL, treatment technique, monitoring and reporting, public notification'
      - 'health-based or not, contaminant group and rule'
      - 'system type (community, non-transient, transient), source water and size class'
      - 'enforcement action type and status; failing / at-risk status'
    agent_questions:
      - Which public water systems serving more than 10,000 people have an open health-based violation, and what enforcement has followed?
      - Is the water system that serves a given address failing or at risk, and for which contaminants?
      - What did the regulator order the owner of a given water system to do, and by when?
    scores:
      {
        agent_demand: 5,
        rights_clarity: 3,
        acquisition_ease: 4,
        structuring_value: 3,
        freshness: 4,
        low_onboarding_cost: 4,
        poor_existing_access: 3
      }
    evidence: [ docs/sources/pipeline/research-2026-10-04.md ]
    next_action: Archive full CA SDWIS and SAFER snapshots to R2, add a US-wide second state source with PWSID, and link Ontario through a Canadian registry or split it out.
