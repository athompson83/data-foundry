datasets:
  - key: rail-accident-investigations
    name: Rail accident and incident investigations
    category: transport-safety
    entity: rail accident or incident investigation with findings and causes
    stage: SCREENED
    description: "One record per rail accident or serious incident, assembled from the FRA Form 54 railroad-reported accident
      data (structured: railroad, cause codes, damage, casualties, coordinates, railroad narrative), the NTSB Railroad
      Investigation Reports (free-text findings, probable cause and recommendations, with the RRD case number) and the UK RAIB
      reports (free-text investigation reports and summaries, a second jurisdiction). Within the US, an NTSB investigation
      links to its FRA Form 54 record by occurrence date and state, then railroad, place and train identifier; this is a
      reviewed candidate link because FRA records never cite an NTSB case number. RAIB covers Great Britain and joins only
      through the shared taxonomy. Every fact carries its source; personal data is excluded."
    sources:
      - rail-us-fra-form54-accidents
      - rail-us-ntsb-railroad-investigation-reports
      - rail-uk-raib-reports
    join_keys:
      - key: occurrence date + state, then railroad reporting mark, place and train identifier (NTSB case to FRA accident number)
        between:
          - rail-us-ntsb-railroad-investigation-reports
          - rail-us-fra-form54-accidents
        measured: 12/33 NTSB RIRs (2021 to 2026 occurrences, date and state parsed) have an FRA Form 54 record on the same date in the same state; 9/12 are the same accident on hand check (3 rejected on place or railroad); 0 of the 36 FRA narratives that mention NTSB cite a case number, so no declared join exists; 21 NTSB reports match no same-day same-state FRA record (many are transit or non-FRA-reportable, or the date differs)
        mode: candidate
        reviewed: { correct: 9, checked: 12 }
    taxonomy:
      - accident type (derailment, collision, grade-crossing, fatality, other impact)
      - primary and contributing cause (FRA cause code, NTSB probable cause, RAIB causal factor)
      - railroad and operation type (freight, passenger, transit, yard, heritage)
      - consequence (fatalities, injuries, damage cost, hazmat release)
      - investigating authority and jurisdiction
    agent_questions:
      - Which NTSB-investigated railroad accidents involved a conductor fatality in a shoving movement, and what did the railroad report to FRA?
      - What probable causes did the NTSB and the FRA cause codes assign to derailments on a given railroad in the last five years?
      - Which RAIB investigations of level-crossing or tram collisions list the same causal factor as a US collision investigation?
      - What safety recommendations followed an accident, and has the same railroad had repeat Form 54 reports at that location?
    scores: { agent_demand: 4, rights_clarity: 4, acquisition_ease: 3, structuring_value: 5, freshness: 4, low_onboarding_cost: 3, poor_existing_access: 4 }
    evidence: [ docs/sources/pipeline/research-2026-10-04.md ]
    next_action: Archive the FRA dataset snapshot and the NTSB RIR set to R2, extract probable cause and recommendations deterministically, and re-measure the date, state, railroad and train link on the full set before EVIDENCED.
