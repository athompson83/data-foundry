datasets:
  - key: pipeline-hazmat-incidents
    name: Pipeline and hazardous-materials release incidents with narrative, substance, cause and damages
    category: chemical-safety
    entity: hazmat_release_incident (one reported pipeline or hazardous-materials release with narrative, substance by CAS number, operator, cause and damages) linked to the substance hazard record
    stage: SCREENED
    description: 'One record per reported release, assembled from the US Coast Guard National Response Center (initial reports with narratives, materials and amounts), the Canada Energy Regulator (investigated pipeline incidents with cause and volume) and the NIOSH Pocket Guide for the substance. A CAS number in an NRC material row links the incident to the substance hazard record automatically (62 of 89 distinct CY2026 CAS numbers); NRC report numbers cited in narratives link updates to their originals. Operators and dates only propose reviewed links (0 of 9 NRC to CER pairs were the same event, so the two incident feeds are not cross-linked). PHMSA and TSB are parked (HTTP 403). Narratives are structured into cause, substance, amount and damage fields; personal data in narratives is redacted. Every fact carries its source.'
    sources: [ hazmat-uscg-nrc-incident-reports, pipeline-ca-cer-incidents, chemical-niosh-pocket-guide ]
    join_keys:
      - key: CAS number (exact, leading zeros stripped; NRC MATERIAL_INVOLVED CAS number to NIOSH Pocket Guide CAS number)
        between: [ hazmat-uscg-nrc-incident-reports, chemical-niosh-pocket-guide ]
        measured: '62/89 distinct CY2026 NRC CAS numbers are in the NIOSH index of 626 CAS entries (1321/1453 material rows; 1264 incidents, 18 of them pipeline); 25/25 same substance on hand check of the most frequent'
        mode: declared
      - key: operator company (first word) within 7 days, NRC pipeline incident to CER incident, 2026
        between: [ hazmat-uscg-nrc-incident-reports, pipeline-ca-cer-incidents ]
        measured: '0/9 candidate pairs were the same event on hand check (US releases against Canadian incidents); no cross-border link found'
        mode: candidate
        reviewed: { correct: 0, checked: 9 }
    taxonomy:
      - 'incident class: pipeline, fixed facility, mobile, rail, vessel, storage tank (NRC TYPE_OF_INCIDENT)'
      - 'release substance by CAS number and CHRIS code, with the CER substance category as fallback'
      - 'cause category (NRC INCIDENT_CAUSE and CER why-it-happened category)'
      - 'consequence: fire, evacuation, injuries, fatalities, damage amount'
    agent_questions:
      - 'Which pipeline or chemical releases involved benzene or ammonia in the last year, with the reporter narrative and the NIOSH exposure guidance for the substance?'
      - 'Which operators had repeated crude oil pipeline releases, what caused them and what was the damage?'
      - 'What updates were filed to NRC report 1460339 and what did the caller say changed?'
    scores: { agent_demand: 4, rights_clarity: 3, acquisition_ease: 4, structuring_value: 4, freshness: 5, low_onboarding_cost: 3, poor_existing_access: 3 }
    evidence: [ docs/sources/pipeline/research-2026-10-04.md ]
    next_action: 'Reopen PHMSA and TSB from a permitted route to add the operator-filed incident reports (join on the cited NRC report number); measure the CAS link over 2010 to 2025 NRC files; read the USCG privacy policy.'
