candidates:
  - key: hazmat-uscg-nrc-incident-reports
    name: US Coast Guard National Response Center incident reports (narratives, materials with CAS numbers, pipeline and hazmat releases)
    category: chemical-safety
    structuring: event-extraction
    format: free-text
    publisher: US Coast Guard National Response Center
    stage: SCREENED
    rights: AMBER
    sources: [ 'https://nrc.uscg.mil/', 'https://nrc.uscg.mil/FOIAFiles/CY26.xlsx' ]
    scores: { agent_demand: 4, rights_clarity: 3, acquisition_ease: 4, structuring_value: 5, freshness: 5, low_onboarding_cost: 3, poor_existing_access: 3 }
    terms:
      - url: https://nrc.uscg.mil/
        quote: 'The spreadsheets posted to the NRC website contain INITIAL incident data that has not been validated or investigated by a federal/state response agency.'
    conditions:
      - 'The page states no licence; this rests on ADR-0018 free public access (free download, no login). The USCG privacy and security policy at uscg.mil/Disclaim returned HTTP 403 and was not read; read it from a permitted route before paid delivery.'
      - 'Label every record as an initial, unvalidated report; exclude drills (CALLTYPE DRL).'
      - 'Redact personal data in narratives (89 of 16,552 CY2026 descriptions match a phone-number pattern) and publish no caller identity.'
      - 'Only 8.8% of material rows carry a real CAS number and UN_NUMBER is empty in CY2026, so oil and fuel releases link by name only.'
    evidence: [ docs/sources/pipeline/research-2026-10-04.md ]
    next_action: 'Parse the yearly workbooks and decade bundles (CY90 to CY26) into incident, material and narrative tables, extract cited NRC report numbers, and write the ADR-0013 rights record after reading the USCG policy.'

