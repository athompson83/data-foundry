datasets:
  - key: dietary-supplement-product-labels
    name: Dietary supplement and natural health product register (US and Canada labels, ingredients, claims, enforcement)
    category: health
    entity: dietary supplement or natural health product (brand, product name, UPC/GTIN, NPN, ingredient rows with UNII, claims, label statements, regulator enforcement events)
    stage: SCREENED
    description: "One record per supplement product, assembled from the NIH DSLD US label corpus (ingredient rows with UNII codes, claims, directions, warnings, UPC), Health Canada's licensed-NHP register (NPN licence, medicinal and non-medicinal ingredients, approved purpose, risk statements), the FDA Health Fraud Product Database (undeclared-drug and warning events, free text) and Open Food Facts GTIN records. A Natural Product Number cited in a DSLD label statement is the declared link to the Health Canada licence, and a check-digit-valid UPC/GTIN links to Open Food Facts; names, brands and ingredient names only propose reviewed links. FDA tainted-product events attach to a product only by reviewed name match because the FDA table carries no UPC or NPN. Every fact keeps its source record, and disagreements between regulators are kept per source."
    sources:
      - dsp-nih-dsld-labels
      - dsp-health-canada-lnhpd
      - dsp-fda-health-fraud-database
      - dsp-open-food-facts-supplements
    join_keys:
      - key: Natural Product Number (NPN) cited in DSLD statement text equals the LNHPD licence number
        between:
          - dsp-nih-dsld-labels
          - dsp-health-canada-lnhpd
        measured: 120/120 DSLD labels returned by an NPN keyword search carry an 8-digit NPN present in LNHPD (93/123 distinct label-NPN pairs resolve); only 334 of 214,780 DSLD labels (0.16%) mention NPN at all
        mode: declared
        reviewed: { correct: 11, checked: 12 }
      - key: UPC/GTIN (check-digit valid, normalised to GTIN-13) shared by a DSLD record and an Open Food Facts product
        between:
          - dsp-nih-dsld-labels
          - dsp-open-food-facts-supplements
        measured: 3/37 check-digit-valid DSLD UPCs from a random 48-label sample exist in Open Food Facts (1 of 3 in its supplements category)
        mode: declared
        reviewed: { correct: 3, checked: 3 }
      - key: FDA Health Fraud product name exactly equals a DSLD product name (candidate only, no shared identifier)
        between:
          - dsp-fda-health-fraud-database
          - dsp-nih-dsld-labels
        measured: 1/40 sampled FDA Public Notification products has an exact-name DSLD label (Arize); firm differs, so the match is unconfirmed
        mode: candidate
    taxonomy:
      - 'product class: dietary-supplement | natural-health-product | homeopathic | sports-nutrition'
      - 'LanguaL physical state and product type codes (DSLD) mapped to LNHPD dosage form'
      - 'ingredient category: vitamin | mineral | botanical | amino-acid | blend | other, keyed to UNII where DSLD supplies it'
      - 'claim type: structure-function | health-claim | approved-NHP-purpose'
      - 'enforcement event: undeclared-drug | warning-letter | recall | advisory'
    agent_questions:
      - Is this US supplement also licensed in Canada, under which NPN, and with what approved purpose and risk statements?
      - Which products with this UPC or NPN have an FDA hidden-ingredient notice, warning letter or recall, and what undeclared drug was found?
      - Which supplements on the market contain a given ingredient (by UNII) at or above a stated amount per serving?
      - Which label claims are structure-function statements and which are Health Canada approved purposes for the same formulation?
    scores: { agent_demand: 4, rights_clarity: 4, acquisition_ease: 4, structuring_value: 4, freshness: 4, low_onboarding_cost: 4, poor_existing_access: 3 }
    evidence: [ docs/sources/pipeline/research-2026-10-04.md ]
    next_action: Re-measure the NPN and UPC joins from archived inputs on a random DSLD sample (not an NPN keyword search), extract NPN and UPC from DSLD statements, and review the FDA name links before EVIDENCED.
