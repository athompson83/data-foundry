dataset_edit:
  key: consumer-product-recalls-north-america
  join_keys_add:
    - key: cited legacy Health Canada notice URL (CPSC Inconjunctions[].URL on healthycanadians.gc.ca, resolved by its redirect to the recalls-rappels.canada.ca notice URL)
      between:
        - cpsc-recalls
        - health-canada-consumer-product-recalls
      measured: 831/834 CPSC recalls citing a healthycanadians.gc.ca recall URL redirect (one HEAD each, 834/834 answered 200)
        to a Consumer product safety notice in the Health Canada open-data index of 2026-10-04 (CPSC list 2026-10-04, 10,027
        recalls); none of the 831 also cites a current URL, so they add to the 342/371 already linked. Unresolved are
        10029 and 15091 (stay on the legacy host) and 13114 (resolves to a drug notice outside Consumer product safety)
      mode: declared
  next_action_append: >-
    2026-10-04 widening round 2: resolve the 834 legacy Health Canada citations at ingest (about +831 declared links, 343 to
    about 1,174); treat the CPSC API HTTP-200 error body as a failed fetch and split the window; add CPSC recall 15190
    (in the SaferProducts export, absent from the API list); persist TC, PROFECO and ACCC citations; widen the Health Canada
    organisation filter (about 93 consumer-type notices sit under other organisation values). PROFECO's Red de Alerta
    Rapida is PARKED on its gob.mx terms. See evidence/2026-10-04/recalls-widening/notes.md.

dataset_edit_home_product_recalls_global:
  key: home-product-recalls-global
  join_keys_add:
    - key: exact GTIN with a valid GS1 check digit, within 365 days (UK barcode to CPSC ProductUPCs or description GTIN)
      between:
        - uk-opss-product-safety-alerts
        - cpsc-recalls
      measured: 2 UK notices link to 2 CPSC recalls on 11 GTIN pairs (Boxine tonies R-blocks UK 2203-0518 to CPSC 22736;
        Make Believe Ideas Rainbow Road board books UK 2309-0140 to CPSC 23292), 2/2 correct, over 3,746 UK notices and
        10,027 CPSC recalls (CPSC carries a GTIN in 646 recalls)
      mode: declared
    - key: EU Safety Gate brand field as a whole word in the Health Canada title plus one shared product token, within 120 days
      between:
        - eu-safety-gate-alerts
        - appliance-health-canada-recalls
      measured: 32/12,539 EU notifications (2023-09 to 2026-10) matched; random 20 hand-checked 16/20 correct, 1 not confirmable
      mode: candidate
      reviewed: { correct: 16, checked: 20 }
    - key: EU Safety Gate brand field as a whole word in the CPSC title plus one shared product token, within 120 days
      between:
        - eu-safety-gate-alerts
        - cpsc-recalls
      measured: 43/12,539 EU notifications matched; random 20 hand-checked 12/20 correct, 4 not confirmable
      mode: candidate
      reviewed: { correct: 12, checked: 20 }
    - key: UK title tokens (at least 2 shared distinctive tokens) within 90 days
      between:
        - uk-opss-product-safety-alerts
        - appliance-health-canada-recalls
      measured: 231/3,746 UK notices matched; random 20 hand-checked 9/20 correct, 2 not confirmable
