#                     already exist; their measured additions are in candidate_updates (append to next_action).
#  dataset_edit:      applies now to consumer-product-recalls-north-america (BUILDING): it adds one join between two members
#                     that are already BUILDING, and no new member, so the BUILDING member-stage gate is not affected.
#  dataset_edit_home_product_recalls_global: optional; UK/EU measurements belong to the global dataset (SCREENED).
candidates:
  - key: mx-red-alerta-rapida-alertas-gob-mx
    name: Mexico Red de Alerta Rapida (PROFECO consumer-product alerts, alertas.gob.mx)
    category: product-safety
    structuring: normalization
    format: free-text
    publisher: Mexico PROFECO (Red de Alerta Rapida)
    stage: PARKED
    rights: UNKNOWN
    sources:
      [
        'https://alertas.gob.mx/alertas.php?site=RAR&filtro=PROFECO',
        'https://alertas.gob.mx/detallealerta.php?site=RAR&alerta=739',
        'https://www.gob.mx/terminos'
      ]
    scores:
      {
        agent_demand: 3,
        rights_clarity: 2,
        acquisition_ease: 4,
        structuring_value: 4,
        freshness: 5,
        low_onboarding_cost: 3,
        poor_existing_access: 4
      }
    terms:
      - {
          url: 'https://www.gob.mx/terminos',
          quote: 'Se autoriza al Usuario a visualizar y descargar los materiales contenidos en el sitio solamente para su uso personal y no para un uso comercial.'
        }
      - {
          url: 'https://www.gob.mx/terminos',
          quote: 'La información del portal gob.mx es pública a menos que se indique lo contrario, en cuyo caso antes de reproducirla, deberás observar si tiene derechos reservados y respetarlos en términos de las normas relativas a derechos de autor y propiedad industrial.'
        }
    evidence:
      [
        docs/sources/pipeline/research-2026-10-04.md,
        docs/sources/pipeline/evidence/2026-10-04/recalls-widening/notes.md
      ]
    next_action: >-
      PARKED 2026-10-04: reachable and structured (listing 168 alerts per page, ids up to 1291, newest 2026-09-22; detail
      fields Organismo notificador, Fecha, Marca, Modelo, Categoria, Riesgo, Descripcion with units sold in Mexico, the
      US and worldwide), and CPSC declares links to it (7 CPSC recalls cite an alertas.gob.mx alert, 6 detail pages
      resolve, all 6 same firm, 5/6 identical product; HC joint-recall text names PROFECO in 9 notices), but the gob.mx
      terms restrict materials to personal, non-commercial use and alertas.gob.mx has no licence page (footer says
      Derechos Reservados). Unblock only with a published Libre Uso MX or open-data licence for the RAR dataset or a
      written permission; until then record the cited URLs as links and ingest nothing.

