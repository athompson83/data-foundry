datasets:
  - key: aviation-safety-occurrences
    name: Aircraft accident and incident investigation records linked to airframe and operator
    category: transport-safety
    entity: aviation_occurrence (one investigated or reported accident or incident) linked to aircraft (registration, make, model, serial) and operator
    stage: SCREENED
    description: "One record per accident, serious incident or reported occurrence, assembled from NTSB (US, narratives),
      UK AAIB (report summaries and PDFs) and Transport Canada CADORS (coded occurrence reports). Registration (tail number)
      is normalised and links every source to the same airframe; registration plus an occurrence date within 3 days
      proposes the link between two investigations of one event (for example an NTSB accredited-representative case and the
      AAIB report of the same flight). Operator names only propose reviewed links. Narratives are structured
      deterministically into cause, phase of flight, damage and injury fields. Every fact carries its source; owner and
      crew personal data are excluded. The FAA registry (faa-aircraft-registry, UNKNOWN) is a later enrichment, not a member."
    sources:
      - aviation-ntsb-accident-database
      - aviation-uk-aaib-reports
      - aviation-ca-cadors-occurrences
    join_keys:
      - key: aircraft registration number (normalised) + occurrence date within 3 days (event-level link between investigations)
        between:
          - aviation-ntsb-accident-database
          - aviation-uk-aaib-reports
        measured: 11/2602 NTSB 2026-update registrations also have an AAIB report of the same occurrence (15 report pairs); 20 more registration-only overlaps are the same airframe in other occurrences; 11/11 same-occurrence on hand check
        mode: candidate
        reviewed: { correct: 11, checked: 11 }
      - key: aircraft registration number (normalised), airframe-level link only (not the same occurrence)
        between:
          - aviation-ntsb-accident-database
          - aviation-ca-cadors-occurrences
        measured: 6/2602 NTSB registrations appear in a 6 MB CADORS Range sample; 6/6 same airframe on hand check, none the same occurrence
        mode: candidate
        reviewed: { correct: 6, checked: 6 }
      - key: aircraft registration number (normalised), airframe-level link only (not the same occurrence)
        between:
          - aviation-uk-aaib-reports
          - aviation-ca-cadors-occurrences
        measured: 30/8856 AAIB registrations appear in a 6 MB CADORS Range sample; 22/25 same airframe on hand check (1 contradicted, 2 undecidable)
        mode: candidate
        reviewed: { correct: 22, checked: 25 }
    taxonomy:
      - occurrence class (accident, serious incident, incident)
      - phase of flight
      - occurrence category (CAST/ICAO-style event names mapped from CADORS events and NTSB sequence of events)
      - aircraft category and operation type (FAR part, commercial, general aviation, rotorcraft)
      - injury severity and aircraft damage
    agent_questions:
      - What accidents and incidents has aircraft N4698W or G-OATW been involved in, across the US, UK and Canada?
      - Which investigations of this type of aircraft cite the same cause or phase of flight in the last five years?
      - Which operators have repeated occurrences of a given category, with the investigating agency's narrative for each?
      - Did a foreign authority investigate the same event that the NTSB opened as an accredited representative?
    scores:
      {
        agent_demand: 4,
        rights_clarity: 4,
        acquisition_ease: 3,
        structuring_value: 5,
        freshness: 4,
        low_onboarding_cost: 3,
        poor_existing_access: 3
      }
    evidence: [ docs/sources/pipeline/research-2026-10-01.md ]
    next_action: Run the EVIDENCED round - full NTSB history via the keyed API, AAIB content API plus PDFs into R2, CADORS full CSV counts, a placeholder-safe registration normalizer, and re-measured links; add 'registration number' to the declared-identifier list if the owner agrees.
