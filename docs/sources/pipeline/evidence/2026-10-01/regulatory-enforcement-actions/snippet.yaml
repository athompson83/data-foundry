datasets:
  - key: regulatory-enforcement-actions
    name: Regulatory enforcement actions against companies (US federal and UK, narrative-level)
    category: regulatory
    entity: enforcement_action (one warning letter, civil or administrative case, litigation release or consumer-protection order against a named company, with violation narrative, relief and penalty)
    stage: SCREENED
    description: "One record per enforcement action published by the FDA, EPA, SEC, CFPB, FTC and the UK CMA. Free-text
      letters, releases and case pages are parsed deterministically into respondent, forum, cited statutes or CFR sections,
      cited court case numbers, relief and penalty amounts; EPA ECHO supplies structured cases with FRS facility ids,
      DOJ and court docket numbers and penalties. A cited court case number is the only automatic link between
      actions; identical case numbers from two publishers mean the same litigation. Company-name matches across
      agencies only propose a reviewed link to a company profile (never a merge of actions), and agency identifiers
      such as CMS, FEI, FRS ids and CIK link an action to its own agency's registry, not across agencies. Every fact
      carries its source document. Measured on 2026-10-01: no court case number was shared between publishers in the
      samples, so cross-agency linking today is by reviewed company-name candidates."
    sources:
      - fda-warning-letters
      - epa-echo-enforcement-cases
      - sec-litigation-releases
      - cfpb-enforcement-actions
      - ftc-cases-proceedings
      - uk-cma-cases
    join_keys:
      - key: cited court case number (district, year, type, serial) shared by two publishers
        between:
          - epa-echo-enforcement-cases
          - sec-litigation-releases
        measured: 0/911 ECHO federal docket numbers appear in 28 sampled SEC releases (0 shared with 26 CFPB actions, 24 FTC cases and 26 FDA letters either); regex catches only the D:YY-cv-N form so SEC "07 CV 6709" style is undercounted
        mode: declared
      - key: normalised company name, FDA letter recipient to SEC litigation-release respondent
        between:
          - fda-warning-letters
          - sec-litigation-releases
        measured: 4/3548 distinct FDA recipient names equal a respondent among 11,986 SEC releases; 4/4 same company on hand check (Cardinal Health, MiMedx, United Health Products, Vivera Pharmaceuticals); entity link only, different actions
        mode: candidate
        reviewed: { correct: 4, checked: 4 }
      - key: normalised company name, CFPB action to SEC litigation-release respondent
        between:
          - cfpb-enforcement-actions
          - sec-litigation-releases
        measured: 3/379 CFPB action titles equal an SEC respondent; 3/3 same company on hand check (Bank of America N.A., ITT Educational Services, Regions Bank); different actions
        mode: candidate
        reviewed: { correct: 3, checked: 3 }
      - key: normalised company name, EPA ECHO case name to FDA letter recipient
        between:
          - epa-echo-enforcement-cases
          - fda-warning-letters
        measured: 5/3548 FDA recipient names equal an ECHO case name in the 13,652 listed cases; 5/5 same company on hand check (Eli Lilly, Hanover Foods, Kroger, Linemaster Switch, Stavis Seafoods); different actions
        mode: candidate
        reviewed: { correct: 5, checked: 5 }
      - key: normalised company name, EPA ECHO case name to SEC litigation-release respondent
        between:
          - epa-echo-enforcement-cases
          - sec-litigation-releases
        measured: 31/11058 distinct ECHO names equal an SEC respondent; 19/31 same company on hand check, 12 rejected (4 personal names, 5 generic fragments, 3 uncorroborated small-company names)
        mode: candidate
        reviewed: { correct: 19, checked: 31 }
      - key: normalised company name, FTC case title to any other member
        between:
          - ftc-cases-proceedings
          - sec-litigation-releases
        measured: 0/245 FTC titles collected from 12 listing pages equal an SEC respondent or any other member name set
        mode: candidate
    taxonomy:
      - agency and forum (FDA warning letter, EPA civil judicial, EPA administrative, SEC civil action, CFPB administrative or civil, FTC, UK CMA)
      - violation domain (CGMP and product quality, environmental media, securities fraud, consumer finance, deceptive advertising, competition)
      - statute or regulation cited (21 CFR, CWA, CAA, CERCLA, RCRA, Securities Act, Exchange Act, CFPA, FTC Act, CA98)
      - sanction type (warning, injunction, consent decree, civil penalty, redress, disgorgement)
    agent_questions:
      - Which agencies have taken enforcement action against this company in the last five years, and for what conduct?
      - Which companies received FDA warning letters citing CGMP violations at the same site in consecutive years?
      - What penalties and relief did federal regulators impose for a given violation type, by agency and year?
      - Which cited court case number identifies the same litigation across a regulator's release and a court docket?
    scores:
      {
        agent_demand: 5,
        rights_clarity: 4,
        acquisition_ease: 3,
        structuring_value: 5,
        freshness: 5,
        low_onboarding_cost: 3,
        poor_existing_access: 3
      }
    evidence: [docs/sources/pipeline/research-2026-10-01.md]
    next_action: >-
      Build the court-case-number extractor for SEC, CFPB and FTC text and re-measure the declared join on the full
      11,986 releases; resolve the ECHO commercial-use wording in a rights record; link actions to company profiles by
      CIK, FRS id and reviewed name candidates before advancing to EVIDENCED.
