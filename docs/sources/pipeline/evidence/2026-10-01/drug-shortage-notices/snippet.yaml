datasets:
  - key: drug-shortage-notices
    name: Drug shortage and discontinuation notices (US and EU, NDC/RxCUI-linked)
    category: health
    entity: drug_shortage_notice (one regulator notice per product or presentation) with active ingredient, dosage form, strength, status, reason text, expected recovery, linked to NDC, RxCUI, DailyMed set id and ATC
    stage: SCREENED
    description: "One record per regulator shortage or discontinuation notice from the FDA (1,594 notices on 2026-09-30, each with a package NDC) and the EMA catalogue (85 shortages), classed under one status and reason taxonomy. The FDA notice carries a package NDC, which links automatically to the RxNorm RxCUI and the DailyMed set id (24/25 and 25/25 on a sample), and through RxClass to ATC. EMA notices name only the INN, so an FDA-EMA link on the same active substance is a reviewed candidate, never an auto-merge. Reason text is normalised into a closed set (demand increase, manufacturing, active ingredient, discontinuation) with the source quote kept per fact."
    sources:
      - fda-drug-shortages-openfda
      - ema-medicine-shortages
      - nlm-rxnorm-ndc-atc-map
    join_keys:
      # DECLARED but not accepted by the current test regex: a declared key must match
      # /licen[cs]e number|UBI|GTIN|UPC|NOA|FL#|FIPS|zone|case number|cited ... notice URL/. NDC and RxCUI are identifiers
      # that name the counterpart record; add NDC|RxCUI to the regex in tooling/test/source-pipeline.test.ts to enable this entry.
      # - key: package NDC cited by the FDA notice -> RxNorm RxCUI and DailyMed set id
      #   between: [ fda-drug-shortages-openfda, nlm-rxnorm-ndc-atc-map ]
      #   measured: 24/25 package NDCs resolved to an RxCUI that is in the notice's own openfda.rxcui list; 25/25 resolved to a DailyMed set id in the notice's openfda.spl_set_id list
      #   mode: declared
      - key: active substance name (EMA INN equals an openFDA substance_name or generic_name; exact normalised string)
        between:
          - ema-medicine-shortages
          - fda-drug-shortages-openfda
        measured: 14/85 EMA notices have an exact INN match in the 1,594 FDA notices; 14/14 are the same active substance on hand check (one multi-ingredient EMA notice, ADHD medicines, matched on 1 of 3 ingredients)
        mode: candidate
        reviewed: { correct: 14, checked: 14 }
    taxonomy:
      - status (current shortage, resolved, to be discontinued, discontinued)
      - reason class (demand increase, manufacturing or GMP, active ingredient supply, shipping delay, business discontinuation, other)
      - therapeutic category and ATC level (via RxClass, rights permitting)
      - dosage form and route
      - jurisdiction (US FDA, EU EMA)
    agent_questions:
      - Which marketed presentations of this ingredient, by NDC, are in shortage or being discontinued right now, and why?
      - Is this active substance in shortage in both the US and the EU, and when is recovery expected in each?
      - Which equivalent products (same RxCUI or ATC class) are not affected?
    scores:
      {
        agent_demand: 5,
        rights_clarity: 3,
        acquisition_ease: 5,
        structuring_value: 4,
        freshness: 5,
        low_onboarding_cost: 4,
        poor_existing_access: 3
      }
    evidence: [ docs/sources/pipeline/research-2026-10-01.md ]
    next_action: Add NDC|RxCUI to the declared-key regex, archive the openFDA, EMA and NLM inputs in R2, and decide ATC redistribution before advancing to EVIDENCED.
