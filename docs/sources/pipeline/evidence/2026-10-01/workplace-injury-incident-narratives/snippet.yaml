      - The file is SpreadsheetML XML with a .xls name, parse it as XML and expect transient 503 responses from the host.
    evidence: [ docs/sources/pipeline/research-2026-10-01.md ]
    next_action: Locate the current-year coalpublic file (2023 and 2024 returned 503 in the head request) and confirm the annual refresh date before relying on it.
