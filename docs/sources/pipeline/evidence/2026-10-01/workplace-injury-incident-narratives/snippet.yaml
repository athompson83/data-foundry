candidates:
  - key: msha-mine-accident-injury-narratives
    name: MSHA mine accident, injury and illness reports with free-text narrative (2000 to present)
    category: workplace-safety
    structuring: event-extraction
    format: free-text
    publisher: US DOL MSHA
    stage: SCREENED
    rights: AMBER
    sources: [ 'https://arlweb.msha.gov/OpenGovernmentData/DataSets/Accidents.zip', 'https://arlweb.msha.gov/OpenGovernmentData/DataSets/Mines.zip' ]
    scores: { agent_demand: 4, rights_clarity: 4, acquisition_ease: 5, structuring_value: 5, freshness: 5, low_onboarding_cost: 4, poor_existing_access: 4 }
    terms:
      - url: https://www.dol.gov/general/aboutdol/copyright
        quote: 'Materials created by the federal government are generally part of the public domain and may be used, reproduced and distributed without permission.'
      - url: https://arlweb.msha.gov/OpenGovernmentData/OGIMSHA.asp
        quote: 'These files are updated every Friday afternoon unless otherwise noted here.'
    conditions:
      - Credit US DOL MSHA and imply no DOL affiliation or endorsement; never use DOL seals or logos.
      - Publish the NARRATIVE only after a personal-data scan (names, ages, contact details) and drop any record that fails it.
      - Treat each weekly zip as a complete replacement, so rebuild from the snapshot and keep the raw zip in R2.
    evidence: [ docs/sources/pipeline/research-2026-10-01.md ]
    next_action: Archive the full Accidents.zip and Mines.zip to R2, then measure personal-data hits in the narratives and extract equipment, task and body-part facts deterministically.
