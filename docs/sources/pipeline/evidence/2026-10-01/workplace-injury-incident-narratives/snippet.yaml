datasets:
  - key: workplace-injury-incident-narratives
    name: Workplace injury and fatality incident register with narratives (mining first, linked to mine and operator)
    category: workplace-safety
    entity: workplace_injury_incident (one reported accident, injury or illness with mine or establishment, operator, classification and narrative)
    stage: SCREENED
    description: 'One record per MSHA accident, injury or illness report from 2000 to present with its free-text narrative, linked by the declared MSHA mine ID to the Mines register (location, status, SIC) and to EIA annual coal production and employment for that mine. Deterministic extraction turns narratives into equipment, task, body part and mechanism facts. OSHA severe-injury and inspection data (employer, NAICS) is the planned second industry slice once reachable; NAICS or SIC codes are filters, never joins.'
    sources:
      - msha-mine-accident-injury-narratives
      - eia-coal-mine-production-msha-id
    join_keys:
      - key: MSHA mine ID (exact; EIA publishes the MSHA ID per mine, zero-padded to 7 digits)
        between:
          - msha-mine-accident-injury-narratives
          - eia-coal-mine-production-msha-id
        measured: 6287/6673 coal-mine accident rows from 2020 onward in the first 48 percent of the MSHA table match a mine in EIA 2022; 25/25 sampled matches agree on mine name
        mode: declared
      - key: SIC/NAICS code and state (filter only)
        between:
          - msha-mine-accident-injury-narratives
          - osha-severe-injury-reports
        measured: UNVERIFIED (osha.gov returns HTTP 403 to our egress)
        mode: candidate
    taxonomy:
      - workplace_safety.mining.coal
      - workplace_safety.mining.metal_nonmetal
      - workplace_safety.injury.severity
      - workplace_safety.injury.mechanism
    agent_questions:
      - What kinds of injuries and mechanisms recur at underground coal mines of a given operator, and how does that compare with its production and hours?
      - Which mines had days-away-from-work injuries involving a given equipment type in the last two years, with the narrative evidence?
    scores: { agent_demand: 4, rights_clarity: 4, acquisition_ease: 4, structuring_value: 5, freshness: 4, low_onboarding_cost: 4, poor_existing_access: 4 }
    evidence: [ docs/sources/pipeline/research-2026-10-01.md ]
    next_action: Archive full MSHA Accidents and Mines zips to R2, run the personal-data scan on narratives, add the EIA current-year file, and retry OSHA severe-injury access.
