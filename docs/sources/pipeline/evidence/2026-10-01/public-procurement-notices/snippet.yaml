datasets:
  - key: public-procurement-notices
    name: Public tender and contract-award notices (CA, UK, EU), CPV/UNSPSC classified, supplier-registry linked
    category: procurement
    entity: procurement_notice (one tender or contract award notice) with buyer, supplier, classification, value and description
    stage: SCREENED
    description: "One record per public tender or award notice from CanadaBuys, UK Contracts Finder and Find a Tender (OCDS) and EU TED, normalized to one value, currency and classification schema. Free-text descriptions are parsed deterministically into lots, framework references, contract periods and values. A Companies House company number cited in TED winner-identifier and in OCDS GB-COH supplier ids links awardees automatically across publishers at the supplier level only; names and titles never auto-link."
    sources:
      - procurement-canadabuys-notices
      - procurement-uk-contracts-finder-ocds
      - procurement-uk-find-a-tender-ocds
      - procurement-eu-ted-notices
    join_keys:
      - key: Companies House company number (TED winner-identifier = OCDS GB-COH supplier id)
        between: [ procurement-eu-ted-notices, procurement-uk-contracts-finder-ocds ]
        measured: 8/624 distinct TED UK winner ids found in 2,000 Contracts Finder awards (Sep 2026); 12/12 distinct matches checked, 11 same legal name, 1 trading name
        mode: declared
      - key: Companies House company number (TED winner-identifier = OCDS GB-COH supplier id)
        between: [ procurement-eu-ted-notices, procurement-uk-find-a-tender-ocds ]
        measured: 5/624 distinct TED UK winner ids found in 2,000 Find a Tender awards (Aug-Sep 2026)
        mode: declared
    taxonomy:
      - CPV (EU/UK) and UNSPSC (Canada) mapped to one procurement taxonomy
      - notice stage (planning, tender, award, contract)
      - procedure type and framework flag
    agent_questions:
      - Which suppliers won public contracts above a value in a CPV division across the UK and EU in the last 90 days?
      - Which open tenders close in the next 14 days matching a service description, with buyer, value and lots?
    scores: { agent_demand: 5, rights_clarity: 3, acquisition_ease: 4, structuring_value: 4, freshness: 5, low_onboarding_cost: 3, poor_existing_access: 3 }
    evidence: [ docs/sources/pipeline/research-2026-10-01.md ]
    next_action: Obtain a quotable TED reuse statement, extend the declared-key regex for Companies House, then measure extraction hit rates on 20 notices per member.
