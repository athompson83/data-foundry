datasets:
  - key: food-and-health-recalls-global
    name: Global food, drug and health-product recall notices (FDA, Health Canada and CFIA, UK FSA, FSANZ)
    category: product-safety
    entity: recall_notice (one agency notice for a food, drug, device or health product) with affected products (lot, GTIN/UPC, NDC, establishment) and the recalling firm
    stage: SCREENED
    description: 'One record per national agency notice, widening the LIVE fda-recalls feed (US FDA food, drug and device enforcement reports) with Health Canada and CFIA, the UK Food Standards Agency and FSANZ. Free text is parsed deterministically into allergens, pathogens, hazards, classes, check-digit-valid GTINs, lots and dates, under one hazard and class taxonomy. A check-digit-valid GTIN links a notice to the affected product and never merges two recall events. Name and product matches only propose a reviewed link.'
    sources:
      - fda-recalls
      - uk-fsa-food-alerts
      - ca-recalls-food-health-open-data
      - au-nz-fsanz-food-recalls
    join_keys:
      - key: GTIN/UPC (check-digit-valid, Health Canada notice detail page vs FDA code_info)
        between:
          - ca-recalls-food-health-open-data
          - fda-recalls
        measured: '5/29 Health Canada notices fetched (9 hand-correct plus 20 random recent CFIA) carry a UPC that appears in an FDA record; 4/6 of the hand-correct notices with a UPC matched'
        mode: declared
      - key: recalling firm name + product tokens, reviewed for same hazard and date
        between:
          - ca-recalls-food-health-open-data
          - fda-recalls
        measured: '9/80 distinct Health Canada notices with a candidate pair were the same recall event on hand check (4,000 FDA rows, 2,364 HC notices since 2023-12)'
        mode: candidate
        reviewed: { correct: 9, checked: 80 }
      - key: recalling firm name + product tokens, dates within 120 days
        between:
          - uk-fsa-food-alerts
          - fda-recalls
        measured: '0/7 distinct FSA notices with a candidate pair were the same recall event on hand check; no FDA number or GTIN in any of 1,359 FSA items'
        mode: candidate
        reviewed: { correct: 0, checked: 7 }
    taxonomy:
      - 'agency: FDA | HC-CFIA | HC | FSA | FSANZ; jurisdiction: US | CA | UK | AU-NZ'
      - 'product_class: food | drug | device | natural-health-product | veterinary | biologic'
      - 'hazard: undeclared-allergen | pathogen | foreign-material | chemical-contaminant | labelling | cgmp-deviation | mislabelled | other'
      - 'severity: FDA Class I-III | CFIA Class 1-3 | Health Canada Type I-III, kept verbatim and mapped to I | II | III'
      - 'allergen and pathogen: FSA allergen and pathogenRisk values verbatim, others extracted from the reason text'
    agent_questions:
      - Is this UPC, lot or NDC under a recall in the US, Canada, the UK or Australia, and what is the hazard and class?
      - Was this US food recall also issued in Canada, and by whom and when?
      - Which recalls name this firm or establishment across agencies since 2024, by hazard?
      - Which allergen or pathogen recalls hit a given product category in the last 90 days, by country?
    scores:
      agent_demand: 4
      rights_clarity: 4
      acquisition_ease: 4
      structuring_value: 4
      freshness: 5
      low_onboarding_cost: 4
      poor_existing_access: 3
    evidence:
      - docs/sources/pipeline/research-2026-10-01.md
    next_action: 'Extend the Health Canada rights record to the food/health slice and detail pages; build a notice-detail extractor for UPC, lot and best-before; PARKED members (FSIS 403, RASFF key) re-screened from Worker egress.'
