datasets:
  - key: restaurant-health-inspections
    name: Food-establishment inspection and hygiene-rating record with violation text
    category: food-safety
    entity: food_establishment (one licensed or permitted food business) with inspections, scores or ratings and violations
    stage: SCREENED
    description: 'One record per food establishment, assembled from per-jurisdiction inspection feeds (violation text and scores) and the UK FSA hygiene ratings, linked to OpenStreetMap venues by the FSA establishment id that OSM volunteers tag. Each jurisdiction links on its own permit id; no identifier is shared across jurisdictions. Free-text violations are normalised to one violation taxonomy with the source row cited.'
    sources:
      - food-safety-uk-fsa-hygiene-ratings
      - food-safety-osm-fhrs-venues
      - food-safety-sf-lives-inspections
    join_keys:
      - key: cited FHRS establishment reference number (OSM fhrs:id tag naming the FSA FHRSID record)
        between:
          - food-safety-osm-fhrs-venues
          - food-safety-uk-fsa-hygiene-ratings
        measured: 38/40 sampled Cambridge OSM venues resolved to the FSA record (2 stale ids); postcode equal 38/38, business name equal 22/38
        mode: declared
    taxonomy:
      - food business type (FSA BusinessType, Chicago facility_type, NYC cuisine)
      - violation class (temperature control, cross contamination, pests, cleanliness, structure, management)
      - severity (critical, non-critical, priority)
      - result (pass, conditional, fail, rating 0-5)
    agent_questions:
      - Is this establishment safe, and what is its latest rating or score?
      - Which violations recurred at this establishment across inspections?
      - Which food businesses near a point were rated 0 or 1 in the last year?
    scores: { agent_demand: 4, rights_clarity: 3, acquisition_ease: 4, structuring_value: 4, freshness: 3, low_onboarding_cost: 3, poor_existing_access: 3 }
    evidence: [ docs/sources/pipeline/research-2026-10-03.md ]
    next_action: Free-text member is stale (SF ends 2019). Read NYC and Chicago open-data terms to unpark the live violation feeds, then measure full FSA coverage in OSM.
