datasets:
  - key: medical-device-approvals
    name: Medical device clearances and approvals (US FDA 510(k)/PMA, GUDID, Health Canada MDALL) with intended use and recalls
    category: health
    entity: device_approval (one regulator clearance, approval or licence for a medical device) with intended-use text, product code, device identifiers, applicant and the recalls citing it
    stage: SCREENED
    description: 'One record per regulator clearance, approval or licence for a medical device. FDA 510(k) summary PDFs are parsed deterministically into indications for use, predicate K-numbers and product code, and joined to PMA, product classification and GUDID device identifiers. A K-number cited by a GUDID record or by an FDA device recall links to the 510(k) automatically, at the clearance level only. Health Canada MDALL licences link to FDA clearances only as reviewed candidates on company and device name, because no declared identifier was found to match. Never merges two approvals or auto-links on names.'
    sources:
      - fda-device-510k-pma-clearances
      - fda-gudid-udi-devices
      - hc-mdall-device-licences
      - fda-recalls
    join_keys:
      - key: cited premarket submission reference number (K-number), GUDID premarket_submissions to 510(k) k_number
        between:
          - fda-gudid-udi-devices
          - fda-device-510k-pma-clearances
        measured: '29/30 GUDID records (random in-distribution sample) cite a K-number that resolves to an openFDA 510(k) record'
        mode: declared
      - key: cited recall reference number (Z-number to K-number through openFDA device/recall) to 510(k) k_number
        between:
          - fda-recalls
          - fda-device-510k-pma-clearances
        measured: '58/100 sampled FDA device enforcement-report recalls resolve through device/recall (99/100 found by recall number) to a cited K-number present in the 510(k) endpoint'
        mode: declared
      - key: normalised company name + device name tokens, FDA 510(k) applicant to Health Canada licence_name
        between:
          - fda-device-510k-pma-clearances
          - hc-mdall-device-licences
        measured: '54/150 sampled 2025-2026 FDA 510(k) clearances have a Health Canada licence from the same normalised company with shared device-name tokens; 72/150 matched the company only'
        mode: candidate
        reviewed: { correct: 19, checked: 23 }
      - key: device identifier (GTIN/UDI-DI), GUDID primary DI to Health Canada device_identifier
        between:
          - fda-gudid-udi-devices
          - hc-mdall-device-licences
        measured: '0/120 GUDID primary DIs (zero-stripped) appear as a Health Canada device_identifier'
        mode: declared
    taxonomy:
      - 'jurisdiction: US | CA'
      - 'pathway: 510k-traditional | 510k-special | 510k-abbreviated | de-novo | pma | pma-supplement | hc-licence'
      - 'device_class: FDA 1 | 2 | 3 and Health Canada 1 to 4, kept verbatim per regulator'
      - 'product_code: FDA three-letter code and review panel; regulation_number from classification'
      - 'status: SESE | DENG | approved | issued-active | cancelled, kept verbatim and mapped to cleared | refused | active | inactive'
    agent_questions:
      - Is this device cleared in the US and licensed in Canada, and under which K-number, PMA or licence number?
      - What is the intended use (indications for use) and predicate device of this 510(k) clearance?
      - Which recalls cite this 510(k), and what were the class and reason?
      - Which devices under this FDA product code were cleared in the last 12 months, and by whom?
    scores:
      agent_demand: 5
      rights_clarity: 4
      acquisition_ease: 4
      structuring_value: 5
      freshness: 5
      low_onboarding_cost: 4
      poor_existing_access: 3
    evidence:
      - docs/sources/pipeline/research-2026-10-03.md
    next_action: Archive 510(k)/PMA/GUDID/MDALL snapshots in R2, extract indications and predicates from the summary PDFs, and re-measure the Canada link on full files; request FDA-to-Canada identifier links only if a declared field appears.
