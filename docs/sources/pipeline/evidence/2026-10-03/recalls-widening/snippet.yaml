# ---------------------------------------------------------------------------------------------------------------------
# DATASET EDIT for consumer-product-recalls-north-america. DO NOT APPLY WHILE THE MEMBERS ARE SCREENED:
# tooling/test/source-pipeline.test.ts requires every member of a BUILDING dataset to be BUILDING or later. Apply
# when ca-tc-vehicle-recalls-database (then nhtsa-recalls) reaches BUILDING. Also decide scope: these members add
# vehicle, child-restraint, tire and vehicle-equipment recalls; the dataset name and entity stay "recall_notice".
# ---------------------------------------------------------------------------------------------------------------------
dataset_edit:
  key: consumer-product-recalls-north-america
  sources_add:
    - ca-tc-vehicle-recalls-database
    - nhtsa-recalls
  join_keys_add:
    - key: cited Transport Canada notice URL (CPSC Inconjunctions[].URL ?rn= recall number)
      between:
        - cpsc-recalls
        - ca-tc-vehicle-recalls-database
      measured: 76/81 CPSC recalls citing a wwwapps.tc.gc.ca VRDB URL resolve to a recall number in the full VRDB CSV
        of 2026-10-03 (ATV, snowmobile, off-road vehicle, motorcycle and equipment recalls; 5 cite a number absent from the file)
      mode: declared
    - key: cited manufacturer campaign reference number (TC MANUFACTURER_RECALL_NO_TXT equals NHTSA MFGCAMPNO, same make)
      between:
        - ca-tc-vehicle-recalls-database
        - nhtsa-recalls
      measured: 4,665/13,195 Transport Canada recalls that carry a manufacturer number match an NHTSA campaign on the
        exact number with the same make or manufacturer (5,384 match on the number alone); random 20 hand-checked
        20/20 same OEM and defect
      mode: declared
    - key: NHTSA named in the CPSC title + manufacturer + model + date within 120 days
      between:
        - cpsc-recalls
        - nhtsa-recalls
      measured: 10/13 CPSC recalls whose text names NHTSA are joint child-seat recalls with an NHTSA C campaign
        (1998-2016; 2 of them cite the NHTSA number as 02E-027 and 99E-022 for campaigns 02C027000 and 99C022000);
        of the other 3, one is a 1990 Kolcraft car-seat repair with no NHTSA campaign in the files and two (a gas regulator, a fire extinguisher) name NHTSA incidentally
      mode: candidate
      reviewed: { correct: 10, checked: 10 }
    - key: make + shared model token + date within 90 days (child seat, booster, tire, equipment)
      between:
        - ca-tc-vehicle-recalls-database
        - nhtsa-recalls
      measured: 130/443 Transport Canada child-seat, booster, tire and equipment recalls since 2010 match an NHTSA
        C, T or E campaign on make, a shared model token and a date within 90 days; the 82 tire matches dominate
      mode: candidate
      reviewed: { correct: 16, checked: 20 }
  taxonomy_add:
    - "agency: NHTSA | TC (jurisdiction US | CA)"
    - "vehicle_class: vehicle | child-restraint | tire | equipment (NHTSA RCLTYPECD V/C/T/E; Transport Canada CATEGORY_ETXT)"
  agent_questions_add:
    - Is this child car seat, tire or vehicle-equipment recall also issued in Canada, and under what manufacturer campaign number?
