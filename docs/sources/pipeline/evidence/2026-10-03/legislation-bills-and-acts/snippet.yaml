datasets:
  - key: legislation-bills-and-acts
    name: Legislation - bills and Acts with status history, sections and amendments (Canada first)
    category: legal
    entity: act (one federal Act or bill with its enacting chapter, parliament and session, bill number, amendment citations, in-force dates and section structure)
    stage: SCREENED
    description: 'One record per Act, assembled from the consolidated, point-in-time Act XML (sections, amendment citations, in-force dates, bill number, parliament and session) and the as-enacted Canada Gazette Part III text. The cited statute chapter reference number (S.C. year, chapter) links an enacted chapter to its consolidated Act automatically; a bill number links an Act to its parliamentary stage history once the LEGISinfo terms are confirmed. Titles only propose reviewed links. Measured on 2026-10-03: 39 of 136 Gazette chapters from 2020 to 2025 resolve to a standalone consolidated Act (the rest amend existing Acts), and all 9 matched 2023 titles agree. UK, US and Australian feeds are screened separately and are not yet linked to a counterpart.'
    sources:
      - legislation-ca-justice-laws
      - legislation-ca-gazette-part3
    join_keys:
      - key: cited statute chapter reference number (S.C. year, chapter), Gazette Part III to Justice Laws OfficialNumber
        between:
          - legislation-ca-gazette-part3
          - legislation-ca-justice-laws
        measured: '39/136 Gazette Part III chapters (2020-2025) equal a Justice Laws OfficialNumber; unmatched chapters are amending Acts with no standalone consolidation; 9/9 matched 2023 chapters show identical titles'
        mode: declared
    taxonomy:
      - legal.legislation.act
      - legal.legislation.bill_stage
      - legal.legislation.amendment
      - legal.legislation.in_force_date
    agent_questions:
      - Which federal Acts were enacted in 2023, and which sections of each are in force or not yet in force today?
      - Which Acts amended the Criminal Code in the last two years, by chapter citation, with the enacting text?
      - What bill number, parliament and session produced a given Act, and when did it receive royal assent?
    scores: { agent_demand: 4, rights_clarity: 3, acquisition_ease: 4, structuring_value: 4, freshness: 4, low_onboarding_cost: 3, poor_existing_access: 3 }
    evidence: [ docs/sources/pipeline/research-2026-10-03.md, docs/sources/pipeline/evidence/2026-10-03/legislation-bills-and-acts/results.json ]
    next_action: Write the SI/97-5 rights record, archive Legis.xml, Act XMLs and 2020-2025 Part III PDFs to R2, extend the Gazette parser to pre-2020 index pages, then re-screen LEGISinfo terms to add bill stages.
