    name: Justice Laws consolidated federal Acts (Canada, XML with amendment and in-force data)
    category: legal
    structuring: normalization
    format: structured
    publisher: Department of Justice Canada
    stage: SCREENED
    rights: AMBER
    sources: [ 'https://laws-lois.justice.gc.ca/eng/XML/Legis.xml' ]
