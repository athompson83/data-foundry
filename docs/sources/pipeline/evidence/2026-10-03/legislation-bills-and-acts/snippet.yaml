    terms:
      - url: https://laws-lois.justice.gc.ca/eng/XML/SI-97-5.xml
        quote: 'Anyone may, without charge or request for permission, reproduce enactments and consolidations of enactments of the Government of Canada, and decisions and reasons for decisions of federally-constituted courts and administrative tribunals, provided due diligence is exercised in ensuring the accuracy of the materials reproduced and the reproduction is not represented as an official version.'
    conditions:
      - Exercise due diligence on accuracy of every reproduction (Reproduction of Federal Law Order, SI/97-5).
      - Never represent the reproduction as an official version; carry the Justice Laws currency date (CurrentToDate) and a pointer to the official source on every record.
