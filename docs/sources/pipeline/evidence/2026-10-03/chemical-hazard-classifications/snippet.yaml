datasets:
  - key: chemical-hazard-classifications
    name: Chemical hazard classifications linked by CAS number (NIOSH, PubChem GHS, EPA TSCA)
    category: chemical-safety
    entity: chemical_substance (one substance identified by CAS number, with GHS hazard statements and signal word, occupational exposure text, and US TSCA listing status)
    stage: SCREENED
    description: 'One record per substance, keyed by CAS number. NIOSH supplies occupational symptoms, target organs and first aid prose (626 CAS entries), PubChem supplies depositor-attributed GHS hazard statements, signal word and pictograms, and the EPA TSCA inventory supplies active or inactive US commerce status (70,774 rows). CAS number is an identifier that names the same substance in each source, so it links automatically at the substance level; names and synonyms only propose reviewed links. Mixtures, UVCB entries and multi-CAS NIOSH entries are not auto-linked. ECHA C&L, NITE-CHRIP and CompTox are parked.'
    sources: [ chemical-niosh-pocket-guide, chemical-pubchem-ghs, chemical-epa-tsca-inventory ]
    join_keys:
      - key: CAS number (exact; NIOSH CAS to a PubChem compound whose synonym list contains that exact CAS number)
        between: [ chemical-niosh-pocket-guide, chemical-pubchem-ghs ]
        measured: 27/30 sampled NIOSH CAS numbers (seed 7) resolve to a PubChem CID whose synonyms contain the exact CAS number, and all 27 have GHS hazard statements; the 3 misses are cemented tungsten carbide, VM&P naphtha and decaborane
        mode: declared
      - key: CAS number (exact; NIOSH CAS to TSCA CASRN)
        between: [ chemical-niosh-pocket-guide, chemical-epa-tsca-inventory ]
        measured: 28/30 sampled NIOSH CAS numbers are on the TSCA inventory (all 28 ACTIVE); across the whole NIOSH index 539/626 CAS numbers are on TSCA
        mode: declared
    taxonomy:
      - 'ghs_hazard_statement: H-code and text, per depositor, verbatim from PubChem'
      - 'signal_word: Danger | Warning, as PubChem reports it'
      - 'occupational_target_organs: NIOSH target organs, verbatim'
      - 'tsca_status: ACTIVE | INACTIVE from the EPA inventory activity flag'
    agent_questions:
      - What are the GHS hazard statements for CAS 75-07-0 and which organs does NIOSH say it targets?
      - Is this substance active on the US TSCA inventory, and what first aid does NIOSH list for exposure?
      - Which substances carry H350 (may cause cancer) and are also flagged as potential occupational carcinogens by NIOSH?
    scores: { agent_demand: 5, rights_clarity: 3, acquisition_ease: 4, structuring_value: 4, freshness: 3, low_onboarding_cost: 4, poor_existing_access: 3 }
    evidence: [ docs/sources/pipeline/research-2026-10-03.md, docs/sources/pipeline/evidence/2026-10-03/chemical-hazard-classifications/results.json, docs/sources/pipeline/evidence/2026-10-03/chemical-hazard-classifications/notes.md ]
    next_action: Write rights records for NIOSH (attribution), PubChem (per-depositor) and TSCA; read ECHA terms via a permitted route; add the CAS number phrase to the declared-join regex in tooling/test/source-pipeline.test.ts; re-measure on a larger sample before EVIDENCED.
