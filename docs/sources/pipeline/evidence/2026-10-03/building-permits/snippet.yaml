# Dataset passes: two non-RED members on different registrable domains (seattle.gov, wa.gov) with a hand-checked name link.
datasets:
  - key: building-permits
    name: Building permits (work description, parcel and licensed contractor)
    category: home-services
    entity: BuildingPermit - one municipal building or trade permit with its free-text work description, the property it is for and, where published, the contractor business
    stage: SCREENED
    description: One record per permit from city open-data portals (Seattle SDCI and San Francisco DBI live now, Chicago, NYC and LA parked on unreadable terms), linked to its parcel through exact block and lot or address and to the licensed contractor business through the state licence record. Personal owner and applicant names are never published.
    sources:
      - building-permits-seattle-sdci
      - building-permits-sf-dbi
      - building-permits-sf-assessor-roll
      - contractors-wa-lni-licences
    join_keys:
      - key: parcel block+lot (exact)
        between:
          - building-permits-sf-dbi
          - building-permits-sf-assessor-roll
        measured: 60/60
        mode: candidate
        reviewed: { correct: 8, checked: 8 }
      - key: normalised contractor name
        between:
          - building-permits-seattle-sdci
          - contractors-wa-lni-licences
        measured: 22/40
        mode: candidate
        reviewed: { correct: 18, checked: 22 }
    taxonomy:
      - permit type (new construction, alteration, re-roof, electrical, plumbing, mechanical, demolition, sign)
      - trade scope extracted from the work description
      - residential or commercial use
      - permit status (applied, issued, completed, expired)
    agent_questions:
      - What work was permitted on this property, when, and at what declared cost?
      - Which licensed contractor business did the work, and is its licence active?
      - Which re-roof or HVAC permits were issued in this neighbourhood in the last year?
    scores:
      {
        agent_demand: 4,
        rights_clarity: 3,
        acquisition_ease: 5,
        structuring_value: 4,
        freshness: 5,
        low_onboarding_cost: 4,
        poor_existing_access: 3
      }
    evidence: [ docs/sources/pipeline/research-2026-10-03.md ]
    next_action: Archive Seattle and SF snapshots, add a King County parcel or SF CSLB-licence declared join, and re-measure the contractor-name link on the full Seattle population before EVIDENCED.
