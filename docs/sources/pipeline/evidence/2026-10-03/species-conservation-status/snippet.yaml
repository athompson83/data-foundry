datasets:
  - key: species-conservation-status
    name: Species conservation status (listing, critical habitat, recovery documents, taxonomy)
    category: environment
    entity: A species or subspecies conservation-status record with its jurisdictional listings, critical-habitat and recovery-document references, linked through scientific name
    stage: SCREENED
    description: >-
      One record per taxon assembled from US FWS ECOS (ESA status and recovery plan PDFs), Environment Canada
      (SARA critical habitat with COSEWIC id), Australia EPBC (threatened status with SPRAT id), the GBIF backbone
      (usage key, accepted name) and ITIS (TSN). The same taxon carries different statuses in different
      jurisdictions, which no single feed shows. No declared taxon-id join exists between the status publishers
      (none publishes an ITIS TSN or GBIF key), so scientific name is a reviewed candidate join and taxon keys are
      derived from it.
    sources:
      - species-ecos-fws-listings-recovery
      - species-eccc-sara-critical-habitat
      - species-epbc-threatened-list-au
      - species-gbif-backbone-taxonomy
      - species-itis-taxonomy
    join_keys:
      - key: scientific name exact match (ECOS listed vs Canada SARA critical habitat)
        between: [ species-ecos-fws-listings-recovery, species-eccc-sara-critical-habitat ]
        measured: '19/273 Canada scientific names equal an ECOS-listed name after dropping parenthetical synonyms and lower-casing; hand-checked 19 of 19 as the same taxon by binomial and common name.'
        mode: candidate
        reviewed: { correct: 19, checked: 19 }
      - key: scientific name exact match (ECOS listed vs Australia EPBC)
        between: [ species-ecos-fws-listings-recovery, species-epbc-threatened-list-au ]
        measured: '51/2222 EPBC rows share a scientific name with an ECOS-listed species (28 pairs have different status words, for example Quokka Endangered in ECOS and Vulnerable in EPBC); hand-checked 51 of 51 as the same taxon by binomial and common name.'
        mode: candidate
        reviewed: { correct: 51, checked: 51 }
      - key: scientific name exact match (Canada SARA vs Australia EPBC)
        between: [ species-eccc-sara-critical-habitat, species-epbc-threatened-list-au ]
        measured: '0/273 Canada scientific names appear in the EPBC list: no overlap.'
        mode: candidate
      - key: GBIF backbone usage key resolved from scientific name (ECOS vs Canada SARA)
        between: [ species-ecos-fws-listings-recovery, species-eccc-sara-critical-habitat ]
        measured: '21/273 Canada names share a GBIF accepted key with an ECOS name (180 ECOS names in shared genera looked up); hand-checked 19 of 21 correct, the 2 wrong are species versus subspecies rank (Vulpes velox vs V. v. hebes, Ambystoma mavortium vs A. m. stebbinsi), which must not merge.'
        mode: candidate
        reviewed: { correct: 19, checked: 21 }
      - key: scientific name lookup to GBIF backbone usage key (ECOS vs GBIF)
        between: [ species-ecos-fws-listings-recovery, species-gbif-backbone-taxonomy ]
        measured: '175/180 looked-up ECOS names returned an EXACT GBIF match (3 HIGHERRANK, 2 NONE); derived from the name, so a candidate.'
        mode: candidate
      - key: scientific name lookup to ITIS TSN (ECOS vs ITIS)
        between: [ species-ecos-fws-listings-recovery, species-itis-taxonomy ]
        measured: '68/70 overlap names resolved to exactly one ITIS TSN by exact combined-name match (1 none, 1 error); accepted-versus-invalid TSN status was not checked.'
        mode: candidate
    taxonomy:
      - jurisdiction (US federal, Canada federal, Australia federal)
      - status category (extinct, critically endangered, endangered, threatened or vulnerable, species of concern)
      - taxon group (mammals, birds, reptiles, amphibians, fishes, invertebrates, plants)
      - recovery stage (draft, final, revision)
      - critical-habitat designation (final, proposed, none)
    agent_questions:
      - Which species are listed as threatened or endangered in both the United States and Canada, and do the two statuses agree?
      - Which ESA-listed species have a recovery plan newer than a given date, and what recovery criteria does it state?
      - What is a species' accepted scientific name, its ITIS TSN and GBIF key, and every jurisdiction that lists it?
    scores:
      {
        agent_demand: 4,
        rights_clarity: 4,
        acquisition_ease: 4,
        structuring_value: 4,
        freshness: 4,
        low_onboarding_cost: 4,
        poor_existing_access: 3
      }
    evidence: [ docs/sources/pipeline/research-2026-10-03.md ]
    next_action: Measure criteria extraction on 20 ECOS recovery PDFs, add Canada SARA schedule 1 listing text if a bulk route appears, and review the candidate scientific-name links before any publication.
