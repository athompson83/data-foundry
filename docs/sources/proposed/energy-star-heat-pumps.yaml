  commercial_use_allowed: false
  redistribution_allowed: false
  derivative_normalization_allowed: false

  attribution:
    required: true
    text: >-
      Manufacturer-reported, as filed with US regulators. Source: U.S. EPA
      ENERGY STAR dataset, retrieved <date>. EPA makes no warranty as to accuracy
      or fitness, and does not endorse this platform or any product listed here.
    url: https://www.energystar.gov/productfinder
  # The dataset contains no images: all 48 columns are text, number or date.
  # Nothing to decide, so nothing is decided.
  images_reusable: false
  personal_data_present: false

  geographic_notes: >-
    US federal programme. Records carry a `markets` field naming United States
    and/or Canada. A Canadian listing in a US federal dataset does not
    automatically carry Canadian publication rights; if Canadian coverage is ever sold,
    that is a separate question.

  # EMPTY BY DESIGN. This is the field the whole packet exists to fill, and it
  # must be filled by the person who did the reading.
  reviewed_at: null
  reviewed_by: null
  next_review_at: null

acquisition_policy:
  # PROPOSED: the SODA API, which robots.txt does not disallow, in preference to
  # crawling the product-finder UI.
  method: VENDOR_API
  # UNKNOWN until the deferred partner-submitted-rights review establishes the
  # exact account/terms and jurisdictional scope. Null is not permission.
  account_or_product_plan: null
  jurisdiction: null
  approved: false
  approved_by: null
  approved_at: null
  # Honours Crawl-delay: 1 with margin. The cap exists to make an accidental
  # loop visible immediately, not to describe expected traffic.
  max_requests_per_minute: 30
  notes: >-
    Socrata SODA endpoints on data.energystar.gov, paginated with $limit and
    $offset against dataset 83eb-xbyy (ENERGY STAR Certified Heat Pumps), which
    is the canonical parent. The named asset w7cv-9xjt is a derived view whose
    filter is currently empty, so it returns the identical 281,828 rows;
    declaring against the parent with our own explicit product_type filter keeps
    the scope in our configuration rather than in an asset title. No app token
    has been obtained — anonymous requests are throttled harder, and registering
    for a token is a step for a person. First run must be bounded to a sample,
    not the full table.

image_policy:
