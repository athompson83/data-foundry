kill_switch_engaged: false

notes: >-
  DEFERRED CANDIDATE ONLY. 281,828 rows as of 2026-08-21T16:29:50Z. The listed unit is
  a COMBINATION (outdoor unit + indoor unit + optional furnace), not a product —
  one outdoor unit appears in many rows with different ratings per pairing, and
  collapsing that to "the outdoor unit's SEER2" would invent a fact the source
  does not contain. The EPA dataset is observed to carry
  `ahri_reference_number`, but retaining or using that field remains UNKNOWN and
  merely proposed pending appropriate human review and an exact grant for the
  applicable rights-matrix use and surface. Using it to query, join against or
  reconstruct the AHRI directory remains prohibited in platform code. See
  docs/sources/prohibited-sources.md.
