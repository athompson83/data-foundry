provenance_retention:
  retain_artifacts: true
  # Listings lapse and rows disappear from the live list. The retained series
  # is the only way to answer whether a combination appeared in the register at
  # a stated time, and discarding it would make any such claim unexplainable
  # (AGENTS.md rule 10).
  retention_days: null
  legal_hold: false

license_split:
  code_license_id: null
  data_license_id: null
  notes: >-
    No code is vendored from this source. The data licence is unresolved
