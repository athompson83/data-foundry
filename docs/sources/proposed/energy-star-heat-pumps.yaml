key: energy-star-heat-pumps
vertical_slug: hvac

publisher: U.S. Environmental Protection Agency (ENERGY STAR program)
# The Socrata host serving the certified-product datasets. NOTE: the portal root
# https://data.energystar.gov/ now 301-redirects to www.energystar.gov; the
# asset and API paths under this host continue to serve.
domain: data.energystar.gov
# REGULATORY_FILING, not REGULATORY and not CERTIFICATION_BODY.
#
# The EPA hosts the register; manufacturer-/partner-reported values in it are
# submitted by partners and certification bodies, not measured by the EPA.
# `GOVERNMENT` was
# declared here originally and is not in SOURCE_TYPES at all — it would have
# failed Zod and the sources_source_type_allowed CHECK on the day this file was
# promoted, which is the one step of the procedure meant to be mechanical.
# tooling/test/proposed-sources.test.ts now reads these drafts so that cannot
# recur. [REVIEWER] confirm this classification against packet section 4, which
# asks who produced which field.
source_type: REGULATORY_FILING

# PROPOSED, not assigned. A certification programme run by a federal agency
# would rank high, but authority_rank affects fact selection and must not be set
# before the source is real.
authority_rank: 0

# UNDER_REVIEW is not in ACQUIRABLE_STATUSES, so even if this file were moved
# into the loader's path by accident, the acquisition gate would still refuse.
status: UNDER_REVIEW
refresh_cadence: WEEKLY

# Nobody has reviewed this. UNREVIEWED is refused at the write boundary and
# again at the read boundary, which is correct and is where it stays.
rights_classification: UNREVIEWED

attribution_requirement:
  # PROPOSED. The EPA licence states no attribution requirement, but publishing
  # a federal certification record without naming its source is bad practice
  # independent of what is compelled. Reviewer decides.
  required: true
  text: >-
    Manufacturer-reported, as filed with US regulators. Source: U.S. EPA ENERGY
    STAR dataset, retrieved <date>. EPA makes no warranty as to accuracy or
    fitness, and does not endorse this platform or any product listed here.
  url: https://www.energystar.gov/productfinder

robots_policy:
  respect_robots: true
  user_agent: DataFoundryBot
  # robots.txt declares Crawl-delay: 1 for User-agent: *.
  crawl_delay_seconds: 1
  # ACQUISITION-SCOPED SUMMARY, not the whole file. The retrieved snapshot has
  # 54 Disallow lines; the ones that bear on how we would fetch are recorded
  # here, and the complete listing is in the packet, section 7.
  #
  # /api/odata/ and /OData.svc/ are disallowed OUTRIGHT — which rules out the
  # OData route the vendor's own documentation promotes. The SODA path is not
  # disallowed, and that is why acquisition_policy.method is VENDOR_API over
  # /resource/ rather than OData.
  disallowed_paths:
    - /api/odata/
    - /OData.svc/
    - /browse
    - /page
    - /catalog
    - /facet
    - /tiles/
    - /login
  allowed_paths:
    - /resource/
    - /api/views/
  robots_url: https://data.energystar.gov/robots.txt
  # Retrieved 2026-08-22T00:40:01Z; the bytes are kept at
  # docs/sources/evidence/data.energystar.gov-robots.txt so this hash is
  # checkable rather than asserted.
  snapshot_hash: a6c856352c621a97f9fcfb2b212d4fc530169b319c9e7b49fc2e6299d736c7a2
  snapshot_at: 2026-08-22T00:40:01Z

rights_policy:
  publisher_legal_entity: United States Environmental Protection Agency
  terms_url: https://edg.epa.gov/EPA_Data_License.html
  # PROPOSED. The EPA licence asserts US public domain under 17 U.S.C. 105.
  # Whether that is best recorded as a US-PD SPDX identifier, and whether it
  # reaches partner-submitted values inside the compilation, is exactly the
  # question in section 4 of the packet. Left null rather than guessed.
  license_id: null
  license_text_ref: null
  api_terms_url: null

  # ALL FOUR ARE FALSE UNTIL A HUMAN SAYS OTHERWISE. Silence is not permission,
