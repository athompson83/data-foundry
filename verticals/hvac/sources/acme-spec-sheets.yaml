# =============================================================================
# acme-spec-sheets — PDF specification sheets.
#
# SYNTHETIC SOURCE. Acme Climate Systems is a FICTIONAL company invented for
# this factory proof. The PDF in fixtures/ is generated by a committed script
# (fixtures/generate-acme-spec-pdf.ts) and was authored by us; it is not a copy
# of anyone's document. The domain is an RFC 2606 reserved example domain and
# resolves nowhere. See RIGHTS.md.
#
# Role in the proof: the hard format. Doc 17 lists "technical specs buried in
# PDFs" as a strong niche signal, and it is a strong signal precisely because
# PDFs resist everyone else. This is the only source for sound level and the
# only one publishing tonnage and BTU side by side.
# =============================================================================

key: acme-spec-sheets
vertical_slug: hvac

publisher: Acme Climate Systems (SYNTHETIC — fictional publisher)
domain: docs.acme-climate.example.com
source_type: MANUFACTURER

# Higher than the same manufacturer's JSON catalogue (85). A published spec
# sheet is an engineering document that changes rarely and is checked before
# release; the catalogue feed is generated from a merchandising system. Same
# publisher, different reliability — which is why authority is per-source, not
# per-publisher.
authority_rank: 90

status: ACTIVE
refresh_cadence: QUARTERLY

rights_classification: GREEN

attribution_requirement:
  required: false
  text: null
  url: null

robots_policy:
  respect_robots: true
  user_agent: DataFoundryBot
  crawl_delay_seconds: 2
  disallowed_paths:
    - /drafts/
    - /internal/
  allowed_paths:
    - /spec-sheets/
  robots_url: https://docs.acme-climate.example.com/robots.txt
  snapshot_hash: ba0d472f19e8c536a7b13f6048d2ce915a03b7e6c81d4f29307a6be5d1c4082f
  snapshot_at: 2026-07-02T09:31:00Z

rights_policy:
  publisher_legal_entity: Acme Climate Systems (fictional entity; synthetic test data)
  terms_url: https://docs.acme-climate.example.com/terms
  license_id: CC-BY-4.0
  license_text_ref: null
  api_terms_url: null
  commercial_use_allowed: true
  redistribution_allowed: true
  derivative_normalization_allowed: true
  attribution:
    required: false
    text: null
    url: null
  # The one source in this vertical with reusable imagery, so that the rule 9
  # machinery is actually exercised rather than merely declared off everywhere.
  images_reusable: true
  personal_data_present: false
  geographic_notes: >-
    Not applicable. Synthetic fixture data authored by the Data Foundry team.
  reviewed_at: 2026-07-02T10:00:00Z
  reviewed_by: Data Foundry platform team
  next_review_at: 2027-07-02

acquisition_policy:
  method: DIRECT_HTTP
  approved: true
  approved_by: Data Foundry platform team
  approved_at: 2026-07-02T10:00:00Z
  max_requests_per_minute: 20
  notes: >-
    Direct HTTPS GET of individual PDF documents linked from model pages.
    Text-layer extraction only; the fixture PDF is generated with a real text
    layer so extraction is genuinely exercised rather than stubbed. No OCR path
    is approved — a scanned spec sheet would be a different acquisition decision
    with different accuracy characteristics, and would need its own review.

# Rule 9, in its permissive form. Dimensional drawings in these sheets ARE
# licensed for reuse, so caching is permitted — and permitted only because
# `images_reusable` is true. The reverse combination (cache without reuse
# rights) fails both the activation and publish gates.
image_policy:
  images_reusable: true
  cache_to_r2_permitted: true
  default_display_modes:
    - THUMBNAIL
    - INLINE
  image_attribution:
    required: true
    text: Dimensional drawings © Acme Climate Systems (synthetic test source).
    url: https://docs.acme-climate.example.com/

provenance_retention:
  retain_artifacts: true
  # PDFs are the hardest artifacts to re-acquire — a superseded spec sheet is
  # usually deleted by the publisher, and it is the only evidence for the values
  # extracted from it. Keep indefinitely.
  retention_days: null
  legal_hold: false

license_split:
  code_license_id: null
  data_license_id: CC-BY-4.0
  notes: >-
    Document content is licensed; the fixture PDF itself is generated by our own
    committed script under the repository's own terms.

kill_switch_engaged: false

notes: >-
  Engineering spec sheets for the current Acme line (24ACC636A003, 24ACC648A003,
  24ACC660A003). Uniquely provides sound level and net weight, and is the only
  source publishing nominal tonnage and BTU/h side by side — which makes it the
  reference for validating the 12000 BTU/h = 1 ton conversion rather than
  trusting it. Covers only three current models: no discontinued units, no other
  manufacturers, no UPC, no certification reference. Disagrees with
  coolsupply-distributor on sound level for 24ACC648A003 (72 dB published vs 69
  dB listed) and wins on authority, 90 to 45.
