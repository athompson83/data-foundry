# =============================================================================
# mcp.yaml — the MCP tool surface for this vertical.
#
# doc 10: "Keep tool count small and intent-oriented." Target 4-6 tools.
#
# Tools are INTENTS, not CRUD wrappers. `get_entity_by_id` is a database method
# with a costume on; `find_replacement_model` is a question a technician
# actually asks. If you can only describe a tool in terms of tables, it is the
# wrong tool.
#
# doc 07: "MCP descriptions are agent SEO." The description is how a model
# decides whether to call you, so it must state: the user intent served, the
# identifiers accepted, what the output means, the citation behaviour, and the
# limitations. All five. Every time.
# =============================================================================

server:
  name: REPLACE_ME
  # Streamable HTTP; SSE is deprecated for new remote MCP connections (doc 10).
  transport: streamable_http
  endpoint: /mcp
  server_card: /.well-known/mcp.json
  agent_card: /.well-known/agent.json

# Output contract every tool inherits (doc 10 "Every high-value answer should
# return"). Declared once so no tool can quietly omit its citations.
response_contract:
  include_canonical_ids: true
  include_normalized_values: true
  include_confidence: true
  include_evidence_refs: true
  include_freshness: true
  include_canonical_url: true
  # Do not return huge raw source blobs unless explicitly requested (doc 10).
  include_raw_source: on_request_only
  # AGENTS.md rule 2 surfaced at the interface: a value with no evidence is not
  # returned as a fact.
  suppress_facts_without_evidence: true
  # Rule 1: sources that fail the publish gate never reach an MCP response.
  exclude_unpublishable_sources: true

tools: []

