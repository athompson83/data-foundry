# =============================================================================
# source-mappings.yaml — per-source field paths -> canonical properties.
#
# THE ONLY FILE THAT KNOWS HOW EPA AND NHTSA SPELL THINGS.
#
# VERIFIED 2026-09-26 against the captured files and the agencies' own field
# descriptions (docs/sources/evidence/vehicles/): EPA vehicles.csv.zip (84
# named columns; data description at fueleconomy.gov/feg/ws/) and NHTSA
# FLAT_RCL_PRE_2010.zip / FLAT_RCL_POST_2010.zip (29 positional fields, order
# per static.nhtsa.gov/odi/ffdd/rcl/RCL.txt). SOURCES.md records, column by
# column, what was checked and what remains open. The fixtures are REAL
# SAMPLES of those files.
#
# Two platform constructs this vertical introduced (see
# services/ingest-worker/src/compile.ts):
#   - `paths: [a, b, c]` — a composite value read from several columns of one
#     row and joined with a space (`join:` overrides). Used for the
#     make + model + year key neither agency publishes as one column.
#   - `parsing.archive` — the artifact is a ZIP archive and one named member
#     is the delimited file (extraction reads it with strict limits; the ZIP
#     stays the evidence artifact).
#   - `source_record_key: [a, b]` — a key composed of several columns. Source
#     record keys are unique across ALL streams of a source, and each of these
#     sources projects one row into two streams, so the second stream needs a
#     key distinct from the first.
# and `parsing.columns` for NHTSA's headerless flat file, plus a generic
# per-stream row filter:
#   - `where: { column: C, in: [v1, ...] }` — only rows whose column C is
#     exactly one of the listed values become records of that stream. Used to
#     keep NHTSA's equipment/tire/child-seat rows out of a vehicle-only model.
#
# Stream order matters within a source: the model-year stream is listed first
# so the configuration/campaign stream's edges can reach the model years its
# own rows create.
# =============================================================================

sources:

  # ===========================================================================
  # 1. epa-fueleconomy-vehicles — fueleconomy.gov vehicles.csv (bulk CSV).
  #    One row per tested configuration; it yields TWO streams: the model year
  #    the row belongs to, and the configuration itself.
  # ===========================================================================
  - source_key: epa-fueleconomy-vehicles
    format: csv
    locator_type: TABLE_CELL
    parsing:
      delimiter: ","
      header_row: true
      # Skips the leading REAL SAMPLE provenance banner of the fixture. Harmless
      # on the real file: its first line is the header (`barrels08,...`) and no
      # line of the 2026-09-26 capture starts with `#`.
      skip_lines_matching: "^#"
      encoding: utf-8
      # VERIFIED 2026-09-26: vehicles.csv.zip (2,211,728 bytes) holds exactly
      # one deflated member, vehicles.csv (21,803,514 bytes, ratio 9.9x, UTF-8
      # ASCII-only, CRLF, RFC 4180 double-quote quoting, 50,409 data rows). The
      # ZIP is the preserved evidence artifact; locators read
      # `member=vehicles.csv;row=…;column=…`. The limits below leave >10x
      # headroom. accept_unarchived lets the fixture (a plain CSV excerpt) and
      # an operator-supplied extracted CSV through; any other non-ZIP body fails.
      archive:
        format: zip
        member: vehicles.csv
        accept_unarchived: true
        max_members: 8
        max_uncompressed_bytes: 268435456
        max_compression_ratio: 200
    records:

      - stream: model_years
        # vehicles.csv is the complete current file, not a delta.
        refresh_mode: full_snapshot
        entity_type: vehicle_model_year
        source_record_key: [id, year]

        aliases:
          - alias_type: make_model_year
            paths: [make, baseModel, year]
            strong: true

        properties:
          - property: model_year
            path: year
          - property: model_name
            path: baseModel

        relationships:
          - predicate: makes
            subject_from: make
            subject_type: make
            subject_resolve_with: publisher_aliases
            object_from: [make, baseModel, year]
            object_type: vehicle_model_year

      - stream: configurations
        refresh_mode: full_snapshot
        entity_type: vehicle_configuration
        source_record_key: id

        aliases:
          - alias_type: epa_vehicle_id
            path: id
            strong: true

        properties:
          - property: model_year
            path: year
          - property: make
            path: make
          - property: model
            path: model
          - property: base_model
            path: baseModel
          - property: vehicle_class
            path: VClass
          - property: cylinders
            path: cylinders
            # Blank for a battery-electric vehicle: correct absence.
            optional: true
          - property: displacement_l
            path: displ
            optional: true
          - property: drive
            path: drive
            map_with: ontology.drive
            # Blank on 1,186 of 50,409 rows (1,178 of them model year 1984):
            # correct absence, not an error.
            optional: true
          - property: transmission
            path: trany
            # Blank on 11 rows (early EVs).
            optional: true
          - property: fuel_type
            path: fuelType
          - property: primary_fuel
            path: fuelType1
            # Blank on 2 rows (Honda CR-V e-FCEV, "Electricity and Hydrogen").
            optional: true
          - property: powertrain_type
            path: atvType
            optional: true
          - property: city_mpg
            path: city08
          - property: highway_mpg
            path: highway08
          - property: combined_mpg
            path: comb08
          - property: co2_tailpipe_gpm
            path: co2TailpipeGpm
          # KNOWN GAP (QUALITY.md): EPA's `range` is the range on fuelType1 and is
          # not in the published data description. It is the all-electric range
          # for an EV, but the TOTAL gasoline+electric range for a plug-in
          # hybrid (the 2017 Volt row says 420; its electric range is `rangeA`)
          # and the hydrogen range for a fuel-cell vehicle. `ev_range_mi` is
          # therefore correct only where powertrain_type is EV. Activation
          # blocker.
          - property: ev_range_mi
            path: range

        relationships:
          - predicate: configuration_of
            subject_from: id
            subject_type: vehicle_configuration
            object_from: [make, baseModel, year]
            object_type: vehicle_model_year

    excluded_fields:
      - path: mfrCode
        reason: >-
          EPA's manufacturer code. Not a make identity we have verified against
          vPIC or NHTSA, so it is not used as one.
      - path: createdOn
        reason: Record-keeping timestamp; recorded on the artifact, not as a vehicle fact.
      - path: modifiedOn
        reason: Record-keeping timestamp; recorded on the artifact, not as a vehicle fact.
      - path: eng_dscr
        reason: >-
          Free-text engine notes (e.g. turbo, start-stop codes) with no
          documented vocabulary yet. Candidate for a later controlled mapping.
      - path: "*"
        reason: >-
          The real file has 84 columns (annual fuel cost, "you
          save/spend", greenhouse score, alternate-fuel figures, PHEV
          charge-depleting values...). Only the columns mapped above are in
          scope for 0.1.0; each addition is a schema_version change.

  # ===========================================================================
  # 2. nhtsa-recalls — NHTSA recall flat files, tab-delimited, no header,
  #    unquoted. VERIFIED 2026-09-26: one row per campaign x make/model/year x
  #    component x manufacturer part (RCL_CMPT_ID / MFR_COMP_*), so one
  #    campaign x make/model/year can span several rows (23,968 of 160,447
  #    vehicle groups do).
  #    Yields TWO streams: the model year each row names, and the campaign.
  # ===========================================================================
  - source_key: nhtsa-recalls
    format: csv
    locator_type: TABLE_CELL
    parsing:
      delimiter: "\t"
      # Skips the leading REAL SAMPLE provenance banner of the fixture.
      # Harmless on the real file, whose rows start with the numeric RECORD_ID.
      skip_lines_matching: "^#"
      # The file is NOT quoted: `"` is literal text and some fields begin with
      # it (for example MFR_COMP_PTNO on 22V176000), which an RFC 4180 parser
      # rejects. Quoting is therefore disabled.
      quote: ""
      # VERIFIED 2026-09-26 against NHTSA's field description RCL.txt ("Last
      # Updated May 2025": 29 fields, 28-29 added May 2025) and against the
      # captured files (all 327,245 data rows have exactly 29 fields). The file
      # has no header row, so these names ARE the mapping; a wrong position
      # silently maps the wrong column. Re-check RCL.txt's change log on every
      # refresh (NHTSA appends fields there).
      columns:
        - RECORD_ID
        - CAMPNO
        - MAKETXT
        - MODELTXT
        - YEARTXT
        - MFGCAMPNO
        - COMPNAME
        - MFGNAME
        - BGMAN
        - ENDMAN
        - RCLTYPECD
        - POTAFF
        - ODATE
        - INFLUENCED_BY
        - MFGTXT
        - RCDATE
        - DATEA
        - RPNO
        - FMVSS
        - DESC_DEFECT
        - CONEQUENCE_DEFECT
        - CORRECTIVE_ACTION
        - NOTES
        - RCL_CMPT_ID
        - MFR_COMP_NAME
        - MFR_COMP_DESC
        - MFR_COMP_PTNO
        - DO_NOT_DRIVE
        - PARK_OUTSIDE
      encoding: utf-8
      # VERIFIED 2026-09-26: there is NO single FLAT_RCL.zip. The complete
      # history is split by report-received date (RCDATE) into two archives,
      # each holding exactly one deflated member:
      #   FLAT_RCL_PRE_2010.zip  (7,435,840 B)  -> FLAT_RCL_PRE_2010.txt  (83,786,437 B, 11.3x)
      #   FLAT_RCL_POST_2010.zip (15,039,755 B) -> FLAT_RCL_POST_2010.txt (311,128,234 B, 20.7x)
      # The glob matches either member (and exactly one per archive). The
      # 512 MiB ceiling leaves ~1.7x headroom over POST_2010, which grows every
      # week. Loading ONE archive as a `full_snapshot` would retire the other's
      # rows: see docs/owner-actions/vehicles-initial-load.md before loading.
      archive:
        format: zip
        member: "FLAT_RCL*.txt"
        accept_unarchived: true
        max_members: 8
        max_uncompressed_bytes: 536870912
        max_compression_ratio: 200
    records:

      - stream: affected_model_years
        # The complete flat file is a full snapshot. A partial (by-year) file
        # would have to be declared `incremental` instead.
        refresh_mode: full_snapshot
        # Vehicle recalls only. RCL.txt: "Vehicle, Equipment, Child Restraint,
        # Or Tire". Captured codes: V, E, T, C, plus I (393 rows) and X (143)
        # before 2010, "safety/product improvement campaigns"; the campaign
        # number's letter always repeats the code. Other rows never become
        # records, so they cannot create model years.
        where: { column: RCLTYPECD, in: [V] }
        entity_type: vehicle_model_year
        source_record_key: [RECORD_ID, YEARTXT]

        aliases:
          - alias_type: make_model_year
            paths: [MAKETXT, MODELTXT, YEARTXT]
            strong: true

        properties:
          - property: model_year
            path: YEARTXT

        relationships:
          - predicate: makes
            subject_from: MAKETXT
            subject_type: make
            subject_resolve_with: publisher_aliases
            object_from: [MAKETXT, MODELTXT, YEARTXT]
            object_type: vehicle_model_year

      - stream: campaigns
        refresh_mode: full_snapshot
        # Vehicle recalls only. RCL.txt: "Vehicle, Equipment, Child Restraint,
        # Or Tire". Captured codes: V, E, T, C, plus I (393 rows) and X (143)
        # before 2010, "safety/product improvement campaigns"; the campaign
        # number's letter always repeats the code. Other rows never become
        # records, so they cannot create model years.
        where: { column: RCLTYPECD, in: [V] }
        entity_type: recall_campaign
        source_record_key: RECORD_ID

        aliases:
          - alias_type: nhtsa_campaign_number
            path: CAMPNO
            strong: true

        properties:
          - property: report_received_date
            path: RCDATE
          - property: component
            path: COMPNAME
          - property: summary
            path: DESC_DEFECT
            # Blank on 7,632 of 286,110 vehicle rows (mostly old campaigns).
            optional: true
          - property: consequence
            path: CONEQUENCE_DEFECT
            # Blank on 16,015 vehicle rows.
            optional: true
          - property: remedy
            path: CORRECTIVE_ACTION
            # Blank on 7,535 vehicle rows.
            optional: true
          - property: manufacturer_campaign_number
            path: MFGCAMPNO
            optional: true
          - property: manufacturer_name
            path: MFGNAME
          - property: potentially_affected
            path: POTAFF
            optional: true
          - property: park_outside_advisory
            path: PARK_OUTSIDE
            optional: true
          - property: do_not_drive_advisory
            path: DO_NOT_DRIVE
            optional: true

        relationships:
          - predicate: recall_affects
            subject_from: CAMPNO
            subject_type: recall_campaign
            object_from: [MAKETXT, MODELTXT, YEARTXT]
            object_type: vehicle_model_year

    excluded_fields:
      - path: BGMAN
        reason: >-
          Build-range start. Meaningful only per VIN; kept out until a VIN
          surface exists to use it honestly (see relationships.yaml).
      - path: ENDMAN
        reason: Build-range end; same reason as BGMAN.
      - path: RCLTYPECD
        reason: >-
          Recall type (V vehicle, E equipment, T tire, C child restraint; I and X
          improvement campaigns before 2010). Read only by both streams' `where`
          row filter, which keeps vehicle (`V`) rows; not published as a fact.
      - path: ODATE
        reason: Owner notification date; not yet in the fact model.
      - path: INFLUENCED_BY
        reason: Investigation provenance code; no documented vocabulary captured.
      - path: MFGTXT
        reason: Manufacturer free text; duplicative of MFGNAME for this vertical.
      - path: DATEA
        reason: Record-added date; recorded on the artifact rather than as a campaign fact.
      - path: RPNO
        reason: Regulation part number; no consumer need yet.
      - path: FMVSS
        reason: FMVSS standard reference; candidate for a later property.
      - path: NOTES
        reason: Free-text notes, often contact details; excluded pending a personal-data check.
      - path: RCL_CMPT_ID
        reason: Internal component id.
      - path: MFR_COMP_NAME
        reason: >-
          Manufacturer component name. Populated since 2020, but cross-joined
          with every make/model/year of the campaign (a HONDA ACCORD row can
          carry an "RLX Sport Hybrid" part), so it is not a per-vehicle fact.
      - path: MFR_COMP_DESC
        reason: Manufacturer component description; cross-joined like MFR_COMP_NAME.
      - path: MFR_COMP_PTNO
        reason: Manufacturer part numbers; cross-joined like MFR_COMP_NAME.
