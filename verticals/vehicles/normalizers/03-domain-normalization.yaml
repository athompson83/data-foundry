# =============================================================================
# Layer 3 — Domain normalization (doc 06): THE IDENTIFIER LAYER.
#
# AGENTS.md rule 7: exact identifiers beat semantic search. These rules produce
# `entity_aliases.normalized_value`, the key the pipeline resolves on and the
# key every read surface probes (ADR-0003 compiles this file into the edge, web,
# MCP and ingestion runtimes).
#
# IDENTIFIER EQUIVALENCE (ADR-0003 / docs/adding-a-new-industry.md).
# All three vehicle rules use the SAME operation chain as HVAC's model numbers:
# upper-case, then strip separators. So the equivalence relation is HVAC's
# case-fold-and-strip-separators; nothing here asks the query layer for a new
# kind of guess. What IS new is that `make_model_year` is a COMPOSITE value
# (three source columns joined by a space before these rules run), and that
# stripping the joining spaces is safe only because the year is always the
# last four digits and the make is resolved separately. Worked example:
#
#     EPA    make=Ford  baseModel=F150  year=2019      -> "Ford F150 2019"
#     NHTSA  MAKETXT=FORD  MODELTXT=F-150  YEARTXT=2019 -> "FORD F-150 2019"
#                         |
#     normalized_value:   FORDF1502019
#
#     (Real rows, captured 2026-09-26. NHTSA "C 300" meets EPA model "C300"
#     but NOT EPA baseModel "C-Class", and NHTSA "ACCORD HYBRID" does not meet
#     EPA baseModel "Accord": see QUALITY.md for the measured join rate.)
#
# Changing a rule changes every join key: bump schema_version, record it in
# CHANGELOG.md and re-verify the goldens.
# =============================================================================

layer: domain_normalization

identifier_rules:
  - alias_type: make_model_year
    strong: true
    retain_source_form: true
    description: >-
      Composite make + model + year. Upper-case and strip every separator, so
      case and punctuation differences between the agencies' spellings do not
      split one model year into two.
    # Exactly HVAC's model_number chain. A model name carrying other
    # punctuation (an apostrophe, `&`, `+`) keeps it; widening the stripped set
    # is a deliberate, versioned change, never a guess.
    ops:
      - op: uppercase
      - op: strip_characters
        characters: "-_. /\\"
      - op: strip_whitespace
    validate:
      min_length: 6
      max_length: 120
      # Must end in a four-digit model year.
      pattern: "^[A-Z0-9]+[0-9]{4}$"
      on_failure: quarantine

  - alias_type: epa_vehicle_id
    strong: true
    retain_source_form: true
    description: EPA record id. Digits only; separators stripped like every other identifier.
    ops:
      - op: uppercase
      - op: strip_characters
        characters: "-_. /\\"
      - op: strip_whitespace
    validate:
      min_length: 1
      max_length: 8
      pattern: "^[0-9]+$"
      on_failure: quarantine

  - alias_type: nhtsa_campaign_number
    strong: true
    retain_source_form: true
    description: >-
      NHTSA campaign number. Sources and users write `20V314000`, `20v314000`
      or `20V-314-000`; the identity is the upper-case run of characters.
    ops:
      - op: uppercase
      - op: strip_characters
        characters: "-_. /\\"
      - op: strip_whitespace
    validate:
      min_length: 9
      max_length: 9
      # Verified on the captured flat files (2026-09-26): YY + recall type
      # letter (V, E, T, C; I and X appear only before 2010) + six characters,
      # the third of which is a letter in 1,678 rows of 2021 vehicle campaigns
      # (for example 21V00H000).
      pattern: "^[0-9]{2}[VEICTX][0-9]{2}[0-9A-Z][0-9]{3}$"
      on_failure: quarantine

# --- Make resolution --------------------------------------------------------
# A deterministic lookup table, not fuzzy matching. Matching is already
# case-insensitive, so EPA's "Honda" and NHTSA's "HONDA"
# are one spelling; list only genuinely different ones.
#
# REAL MAKES, limited to the makes in the REAL SAMPLE fixtures. Both agencies
# spell each of them identically up to case (EPA "Mercedes-Benz", NHTSA
# "MERCEDES-BENZ"), so each entry lists one spelling. Make names are the
# manufacturers' own marks, used nominatively to identify their vehicles.
#
# ACTIVATION GAP (QUALITY.md): the full files name 146 EPA makes and several
# hundred NHTSA makes (most of them heavy-truck, bus, RV and trailer makers EPA
# does not cover). Every make not listed here is quarantined. The complete
# table must be generated from vPIC's make list (GetAllMakes) and reviewed,
# never typed from memory.
publisher_aliases:
  chevrolet:
    canonical_name: Chevrolet
    aliases:
      - Chevrolet
    match: case_insensitive_exact

  ford:
    canonical_name: Ford
    aliases:
      - Ford
    match: case_insensitive_exact

  honda:
    canonical_name: Honda
    aliases:
      - Honda
    match: case_insensitive_exact

  mercedes-benz:
    canonical_name: Mercedes-Benz
    aliases:
      - Mercedes-Benz
    match: case_insensitive_exact

  tesla:
    canonical_name: Tesla
    aliases:
      - Tesla
    match: case_insensitive_exact

  toyota:
    canonical_name: Toyota
    aliases:
      - Toyota
    match: case_insensitive_exact

  volkswagen:
    canonical_name: Volkswagen
    aliases:
      - Volkswagen
    match: case_insensitive_exact

# A make matching nothing above is quarantined, never auto-created.
unknown_publisher_policy: quarantine

notation_rules: []
