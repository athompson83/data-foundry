# =============================================================================
# nhtsa-recalls — NHTSA recall flat files (FLAT_RCL_PRE_2010 / FLAT_RCL_POST_2010,
# tab-delimited, headerless, unquoted).
#
# FAIL-CLOSED DECLARATION. status UNDER_REVIEW, rights UNREVIEWED, acquisition
# not approved, and NOT in acquisition.yaml. See RIGHTS.md.
#
# ADR-0013 determination WRITTEN 2026-09-26 (not yet recorded):
# docs/sources/determinations/nhtsa-recalls.yaml. Basis
# PUBLIC_DOMAIN_US_GOVERNMENT_WORK (17 U.S.C. § 105), every surface ALLOW. The
# free-text NOTES field (business phone numbers) stays excluded.
# =============================================================================

key: nhtsa-recalls
vertical_slug: vehicles

publisher: U.S. Department of Transportation, National Highway Traffic Safety Administration (NHTSA)
domain: static.nhtsa.gov
# REGULATORY_FILING: recall campaigns are manufacturer Part 573 defect reports
# filed with and published by NHTSA. The text is the manufacturer's report, not
# an NHTSA finding.
source_type: REGULATORY_FILING

authority_rank: 0

status: UNDER_REVIEW
# Campaigns are added daily; both flat files carried a 07:02 member timestamp
# and a 16:24 UTC Last-Modified on 2026-09-26 (daily regeneration). WEEKLY is
# the proposed polling cadence.
refresh_cadence: WEEKLY

rights_classification: UNREVIEWED

attribution_requirement:
  required: true
  text: >-
    Source: NHTSA recall data (manufacturer-reported), retrieved <date>. Not
    endorsed by NHTSA or the U.S. Department of Transportation. Check a
    specific vehicle's VIN at nhtsa.gov/recalls.
  url: https://www.nhtsa.gov/recalls

robots_policy:
  respect_robots: true
  user_agent: DataFoundryBot
  crawl_delay_seconds: null
  disallowed_paths: []
  # VERIFIED 2026-09-26: the flat files live under /odi/ffdd/rcl/. No
  # robots.txt is published (HTTP 404 NoSuchKey;
  # docs/sources/evidence/vehicles/robots.json), so there is no snapshot hash.
  allowed_paths:
    - /odi/ffdd/rcl/
  robots_url: https://static.nhtsa.gov/robots.txt
  snapshot_hash: null
  snapshot_at: null

rights_policy:
  publisher_legal_entity: >-
    United States Department of Transportation, National Highway Traffic Safety
    Administration
  terms_url: null
  license_id: null
  license_text_ref: null
  # NHTSA's site-wide policies page (www.nhtsa.gov/about-nhtsa/web-policies-notices)
  # answered HTTP 403 to the build environment; the § 105 basis does not
  # depend on it (ADR-0013). terms_url stays null until it is captured.
  api_terms_url: null
  # Still false: the determination is written but not recorded or activated.
  commercial_use_allowed: false
  redistribution_allowed: false
  derivative_normalization_allowed: false
  attribution:
    required: true
    text: >-
      Source: NHTSA recall data (manufacturer-reported), retrieved <date>. Not
      endorsed by NHTSA or the U.S. Department of Transportation. Check a
      specific vehicle's VIN at nhtsa.gov/recalls.
    url: https://www.nhtsa.gov/recalls
  images_reusable: false
  # The mapped fields carry no personal data. NOTES is excluded until checked.
  personal_data_present: false
  geographic_notes: >-
    US federal publication covering recalls of vehicles and equipment sold in
    the United States.
  reviewed_at: null
  reviewed_by: null
  next_review_at: null

acquisition_policy:
  method: BULK_FILE
  account_or_product_plan: null
  jurisdiction: null
  approved: false
  approved_by: null
  approved_at: null
  max_requests_per_minute: 5
  notes: >-
    PROPOSED. HTTPS GETs of /odi/ffdd/rcl/FLAT_RCL_PRE_2010.zip (7.4 MB) and
    /odi/ffdd/rcl/FLAT_RCL_POST_2010.zip (15.0 MB; 311 MB uncompressed),
    verified 2026-09-26. There is no single FLAT_RCL.zip: the two archives
    together are the full snapshot, which the operator path cannot yet load
    as one (QUALITY.md, docs/owner-actions/vehicles-initial-load.md). The
    per-vehicle recalls API (api.nhtsa.gov/recalls/recallsByVehicle) returned
    exactly the flat file's campaigns for HONDA/ACCORD/2018 and is the
    alternative for a request-time lookup. In the fixture harness this reads
    fixtures/nhtsa-flat-rcl.csv, a REAL SAMPLE of 16 rows.

image_policy:
  images_reusable: false
  cache_to_r2_permitted: false
  default_display_modes: []
  image_attribution:
    required: false
    text: null
    url: null

provenance_retention:
  retain_artifacts: true
  retention_days: null
  legal_hold: false

license_split:
  code_license_id: null
  data_license_id: null
  notes: No code is vendored. No data licence exists; the data is a § 105 federal work (determination written 2026-09-26).

kill_switch_engaged: false

notes: >-
  PROPOSED SOURCE. The column order in source-mappings.yaml `parsing.columns`
  matches NHTSA's RCL.txt and every captured row (SOURCES.md, 2026-09-26). The
  flat files also carry equipment, tire, child-seat and (pre-2010)
  improvement campaigns; the `RCLTYPECD in [V]` row filter keeps vehicle
  recalls only. ADR-0013 determination written:
  PUBLIC_DOMAIN_US_GOVERNMENT_WORK, all surfaces ALLOW, not yet recorded.
