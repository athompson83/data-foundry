# =============================================================================
# seo.yaml — indexability policy, canonical URLs, structured data and LLM/agent
# discovery for the vehicles vertical (doc 07).
#
# AGENTS.md rule 8: no thin pages. Indexability is earned by clearing the gates
# below, and nothing clears them today: the vertical is DRAFT, every source is
# unreviewed, and the fixtures are synthetic. apps/web renders no child route
# for a non-ACTIVE vertical at all.
# =============================================================================

url_prefix: /vehicles

page_classes:

  - id: dataset_landing
    route_kind: static
    path: "/vehicles"
    title: "US Vehicle Recalls & Fuel Economy Data"
    structured_data: Dataset
    sitemap: datasets
    indexable: true
    quality_gate: dataset

  - id: vehicle_model_year_detail
    route_kind: entity_detail
    entity_type: vehicle_model_year
    path: "/vehicles/model-years/{canonical_slug}"
    title: "{canonical_name} recalls and fuel economy"
    structured_data: null
    sitemap: entities
    indexable: conditional
    quality_gate: entity_detail
    description: >-
      The core page: the recalls touching a model year and its EPA-tested
      configurations. structured_data is null: Schema.org `Car`/`Product`
      would imply an offer we do not make.

  - id: make_detail
    route_kind: entity_detail
    entity_type: make
    path: "/vehicles/makes/{canonical_slug}"
    title: "{canonical_name} recalls and fuel economy"
    structured_data: null
    sitemap: manufacturers
    indexable: conditional
    quality_gate: make

  - id: vehicle_configuration_detail
    route_kind: entity_detail
    entity_type: vehicle_configuration
    path: "/vehicles/configurations/{canonical_slug}"
    title: "{canonical_name}"
    structured_data: null
    sitemap: null
    indexable: false
    quality_gate: configuration
    description: >-
      Never indexed: a configuration page is a fragment of its model-year page
      and would duplicate it. Available on API, MCP and as a noindex page.

  - id: recall_campaign_detail
    route_kind: entity_detail
    entity_type: recall_campaign
    path: "/vehicles/recalls/{canonical_slug}"
    title: "NHTSA recall {nhtsa_campaign_number}"
    structured_data: null
    sitemap: entities
    indexable: conditional
    quality_gate: recall
    description: >-
      People search campaign numbers directly, so a campaign page earns an
      index slot at a lower content bar if its facts are complete.

  - id: recall_relationship
    route_kind: relationship
    subject_entity_type: vehicle_model_year
    path: "/vehicles/model-years/{canonical_slug}/recalls"
    title: "Recalls affecting {canonical_name}"
    structured_data: null
    sitemap: relationships
    indexable: conditional
    quality_gate: recall_list

  - id: comparison
    route_kind: comparison
    path: "/vehicles/compare/{slug_a}-vs-{slug_b}"
    title: "{name_a} vs {name_b}"
    structured_data: null
    sitemap: null
    indexable: conditional
    quality_gate: comparison

  - id: filtered_collection
    route_kind: filtered_collection
    entity_type: vehicle_model_year
    path: "/vehicles/model-years/{facet_path}"
    title: "{facet_description}"
    structured_data: null
    sitemap: entities
    indexable: conditional
    quality_gate: filtered_collection

  - id: docs_api_mcp
    route_kind: static
    path: "/vehicles/docs"
    title: "Vehicle Recalls & Fuel Economy API and MCP"
    structured_data: null
    sitemap: datasets
    indexable: true
    quality_gate: none

quality_gates:

  default:
    description: Baseline. No page class may loosen below this.
    min_critical_fact_coverage: 0.75
    min_total_facts: 3
    min_evidence_coverage: 1.0
    min_distinct_sources: 1
    min_entity_quality_score: 0.6
    max_staleness_days: 60
    min_results: 10
    min_unique_content_words: 120
    require_all_sources_publishable: true
    block_on_open_dispute: true

  entity_detail:
    # vehicle_model_year declares two critical properties (model_year,
    # model_name); both must be present. A model-year page's substance is its
    # recalls and configurations, so it must also carry at least one related
    # entity beyond its make.
    min_critical_fact_coverage: 1.0
    min_total_facts: 2
    min_related_entities: 2
    min_evidence_coverage: 1.0
    min_distinct_sources: 1
    min_entity_quality_score: 0.65
    # Recall data goes stale fast: a page claiming "no open recalls" on
    # month-old data is worse than no page.
    max_staleness_days: 14
    min_unique_content_words: 150
    require_all_sources_publishable: true
    block_on_open_dispute: false
    block_on_disputed_critical_property: true
    require_distinct_value: true

  make:
    min_critical_fact_coverage: 0.0
    min_total_facts: 0
    min_related_entities: 3
    min_evidence_coverage: 1.0
    min_distinct_sources: 1
    min_entity_quality_score: 0.6
    min_unique_content_words: 120
    require_all_sources_publishable: true

  configuration:
    min_critical_fact_coverage: 1.0
    min_total_facts: 8
    min_evidence_coverage: 1.0
    min_distinct_sources: 1
    min_unique_content_words: 100
    require_all_sources_publishable: true

  recall:
    min_critical_fact_coverage: 1.0
    min_total_facts: 5
    min_evidence_coverage: 1.0
    min_distinct_sources: 1
    min_entity_quality_score: 0.7
    min_related_entities: 1
    max_staleness_days: 14
    min_unique_content_words: 100
    require_all_sources_publishable: true

  recall_list:
    min_related_entities: 1
    min_evidence_coverage: 1.0
    max_staleness_days: 14
    min_unique_content_words: 100
    require_all_sources_publishable: true

  comparison:
    min_shared_properties: 5
    min_both_entities_indexable: true
    min_unique_content_words: 150
    require_all_sources_publishable: true
    demand_threshold: 0.6

  filtered_collection:
    min_results: 10
    min_indexable_results: 5
    min_unique_content_words: 120
    require_whitelisted_combination: true
    demand_threshold: 0.5
    require_all_sources_publishable: true

  dataset:
    min_entities: 25
    min_evidence_coverage: 0.99
    min_distinct_sources: 2
    require_all_sources_publishable: true
    note: >-
      Two federal families (EPA fuel economy, NHTSA recalls), independent
      agencies with independent collection processes.

  none:
    description: Editorial pages (docs, API reference). No data gate applies.

on_gate_failure:
  robots: "noindex,follow"
  in_sitemap: false
  in_api: true
  in_mcp: true
  show_coverage_notice: true
  notice_template: >-
    This page does not currently meet publication-quality requirements.

sitemaps:
  index: /sitemap-index.xml
  max_urls_per_file: 45000
  # The global sitemap index uses the smallest budget across bundled verticals;
  # 250 matches HVAC so adding this vertical does not shrink HVAC's walk.
  max_scan_pages_per_request: 250
  include_only_indexable: true
  segments:
    - { id: datasets, path: "/sitemaps/datasets.xml" }
    - { id: manufacturers, path: "/sitemaps/makes-{n}.xml" }
    - { id: entities, path: "/sitemaps/entities-{n}.xml" }
    - { id: relationships, path: "/sitemaps/relationships-{n}.xml" }

canonical:
  redirect_on_merge: true
  redirect_status: 301
  filter_pages_canonicalize_to_parent: true
  trailing_slash: false
  preserve_slugs_after_merge: true

structured_data:
  dataset_page:
    type: Dataset
    required_fields:
      - name
      - description
      - creator
      - dateModified
      - license
      - distribution
      - keywords
      - temporalCoverage
  catalog_page:
    type: DataCatalog
    required_fields: [name, description, dataset]
  entity_page:
    type: null
    reason: >-
      Schema.org `Car` / `Product` imply a vehicle offered for sale. A model
      year's recalls and label fuel economy are neither.

images:
  require_rights_decision: true
  fallback_to_generated_visualizations: true
  require_alt_text: true
  alt_text_template: "{canonical_name}"
  note: No source in this vertical supplies images, and none are acquired.

llm_discovery:
  llms_txt: /vehicles/llms.txt
  llms_full_txt: /vehicles/llms-full.txt
  markdown_representation: true
  accept_text_markdown: true
  include:
    - dataset_description
    - resource_groups
    - schemas
    - api_docs
    - openapi_url
    - mcp_endpoint
    - bulk_formats
    - source_methodology
    - freshness_and_changelog
    - licensing_and_access_terms
  markdown_for_non_indexable: true
  markdown_includes_coverage_notice: true

agent_intents:

  recall_lookup:
    tool: traverse_relationships
    examples:
      - "Are there recalls on a {model_year} {make} {model}?"
      - "What recalls affect the {model_year} {model}?"
      - "Is there a do-not-drive recall for {make} {model} {model_year}?"

  identifier_resolution:
    tool: get_entity
    examples:
      - "What is recall {nhtsa_campaign_number}?"
      - "Look up EPA vehicle {epa_vehicle_id}"
      - "Find the {model_year} {make} {model}"

  spec_search:
    tool: search_entities
    examples:
      - "Which {model_year} SUVs get more than 30 mpg combined?"
      - "List electric vehicles with at least 250 miles of range"

  evidence_lookup:
    tool: explain_fact
    examples:
      - "Where does the combined mpg for {model} come from?"
      - "Who reported recall {nhtsa_campaign_number}?"

  comparison:
    tool: compare_entities
    examples:
      - "Compare the fuel economy of {model_a} and {model_b}"

guardrail: >-
  Doc 07: be the best factual result, not a page generator. A recall page must
  never imply a specific vehicle is (or is not) affected; only a VIN check can
  say that.
