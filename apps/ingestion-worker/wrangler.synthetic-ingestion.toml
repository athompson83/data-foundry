# Separate second phase of the SAME temporary identity. Restore the reduced
# readiness manifest afterwards; the receipt harness must not run during this phase.
name = "data-foundry-private-canary-ingestion-worker"
main = "src/synthetic-ingestion.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
[limits]
cpu_ms = 30000
[observability]
enabled = true
[observability.logs]
invocation_logs = false
[vars]
DEPLOYMENT_ENVIRONMENT = "production"
SYNTHETIC_INGESTION_MODE = "fixed-fixtures-v1"
[[r2_buckets]]
binding = "SYNTHETIC_ARTIFACTS"
bucket_name = "data-foundry-private-ingestion-artifacts"
[[queues.consumers]]
queue = "data-foundry-private-ingestion"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
max_concurrency = 1
dead_letter_queue = "data-foundry-private-ingestion-dlq"
# Inject only a verified non-secret account_id and the distinct df_ingestion
# HYPERDRIVE id into ignored wrangler.synthetic-ingestion.production.toml.
