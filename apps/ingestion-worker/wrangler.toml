name = "data-foundry-ingestion-worker"
main = "src/index.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[limits]
cpu_ms = 30000

[observability]
enabled = true
[observability.logs]
invocation_logs = false
[vars]
DEPLOYMENT_ENVIRONMENT = "production"
VERTICAL_SLUG = "hvac"
RAW_ARTIFACTS_BUCKET_NAME = "data-foundry-raw-artifacts"
OPS_ALERTS_ENABLED = "false"
[triggers]
crons = ["*/5 * * * *"]
[[r2_buckets]]
binding = "RAW_ARTIFACTS"
bucket_name = "data-foundry-raw-artifacts"
[[queues.producers]]
binding = "INGESTION_QUEUE"
queue = "data-foundry-ingestion"
[[queues.consumers]]
queue = "data-foundry-ingestion"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
max_concurrency = 1
dead_letter_queue = "data-foundry-ingestion-dlq"

# Supply the distinct df_ingestion Hyperdrive in an ignored exact deployment manifest.
