# Data Foundry Recall Intelligence (ADR-0015).
#
# Unlike the Postgres-backed Workers, every identifier here is a public binding
# name or resource id, not a credential: D1 and R2 are reached through
# bindings, and the Stripe keys are Worker secrets set with `wrangler secret`.
# account_id comes from CLOUDFLARE_ACCOUNT_ID at deploy time.

name = "data-foundry-recalls"
main = "src/index.ts"
compatibility_date = "2026-08-23"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "data.aroqon.com", custom_domain = true },
  { pattern = "api.data.aroqon.com", custom_domain = true },
]

[triggers]
# Every six hours: the recent window for each category plus one rolling
# history window, so status changes on old recalls are picked up.
crons = ["17 */6 * * *"]

[limits]
cpu_ms = 300000

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[vars]
PUBLIC_ORIGIN = "https://data.aroqon.com"
API_ORIGIN = "https://api.data.aroqon.com"
SUPPORT_EMAIL = "data@mail.proviciency.com"
# Public by design: IndexNow proves host ownership by serving this key at
# https://data.aroqon.com/<key>.txt. Changed recall pages are pinged after each sync.
INDEXNOW_KEY = "fe64f391da31667d2989e57acd0ad461"
SOURCE_KILL_SWITCH = "0"
# "1" accepts new checkouts. Opened 2026-09-27 on the Product Owner's launch
# instruction; set "0" to stop new sales (docs/owner-actions/recalls-operations.md).
SALES_OPEN = "1"
# North American consumer-product recalls (ADR-0016). OPEN serves the dataset's API and pages under the existing
# plans; KILL_SWITCH = "1" stops its acquisition and serving (rights kill switch for CPSC and Health Canada).
PRODUCT_RECALLS_OPEN = "1"
PRODUCT_RECALLS_KILL_SWITCH = "0"
# Local-collector extraction intake (ADR-0017). Closed until an operator mints an ingestion credential and opens it;
# EXTRACTED_IDENTIFIERS_OPEN publishes accepted candidates only after the benchmark's quality bar is met.
# INTAKE_WITHDRAWN_SOURCES lists source keys whose submissions are refused (a per-source withdrawal).
COLLECTOR_INTAKE_OPEN = "0"
EXTRACTED_IDENTIFIERS_OPEN = "0"
INTAKE_WITHDRAWN_SOURCES = ""
# RapidAPI channel (ADR-0016). "1" opens it once the listing, agreements, payouts and the
# RAPIDAPI_PROXY_SECRET Worker secret exist and proxy acceptance has passed. Owner decision.
RAPIDAPI_ENABLED = "0"
# Live Stripe price ids for the accepted plan ladder (not secrets).
STRIPE_PRICE_EVALUATE = "price_1UK1SWLlvU3ZaHdipjWWJ8d1"
STRIPE_PRICE_DEVELOPER = "price_1UK1SXLlvU3ZaHdihexV3i4r"
STRIPE_PRICE_GROWTH = "price_1UK1SYLlvU3ZaHdiDieb1aQz"
STRIPE_PRICE_SCALE = "price_1UK1SZLlvU3ZaHdiPZZj62Rv"

# The running version's id and tag (the deploy workflow tags each version with its source
# commit), readable by operators at /admin/version so acceptance is pinned to what is live.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "DB"
database_name = "data-foundry-recalls"
database_id = "84acdedd-4d3e-457e-9bdc-3b118590e172"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RAW_ARTIFACTS"
bucket_name = "data-foundry-raw-artifacts"
