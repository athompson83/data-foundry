# Route-less target profile for the synthetic private canary. Copy this to the
# ignored wrangler.private-canary.production.toml and inject only account_id
# plus this Worker's role-specific Hyperdrive id. Do not add a route, public
# endpoint variables, workers.dev, or a direct database URL.
name = "data-foundry-private-canary-edge"
main = "src/index.ts"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[vars]
DEPLOYMENT_ENVIRONMENT = "production"
PRIVATE_CANARY_MODE = "service-binding"

# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<edge-role-hyperdrive-id>"

[[queues.producers]]
binding = "USAGE_EVENTS_QUEUE"
queue = "data-foundry-private-canary-usage-events"
