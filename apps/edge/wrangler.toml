# Cloudflare Worker manifest for the Data Foundry read surface (ADR-0006).
#
# `account_id`, the Hyperdrive `id` and the route are deployment facts, not
# repository facts. They are left unset on purpose: committing someone's account
# id is how a repository starts carrying credentials-shaped configuration.
# `docs/owner-actions/` records what an operator has to supply.

name = "data-foundry-edge"
main = "src/index.ts"

# node_compat is required for `pg`: Hyperdrive reaches Postgres over Workers TCP
# sockets, and the driver needs Node built-ins to use them. The compatibility
# date must be 2024-09-23 or later for the flag to take effect.
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
DEPLOYMENT_ENVIRONMENT = "production"
# One vertical per deployment. The bundle carries the compiled runtimes by slug
# (see src/index.ts RUNTIMES); this selects which one this Worker serves.
VERTICAL_SLUG = "hvac"
# Credential namespaces are enforced, not labels. Production accepts only
# df_live_* keys; local/test deployments must override this to "test".
API_KEY_ENVIRONMENT = "live"

# Hyperdrive pools Postgres connections at the edge, which is what makes a
# database-backed Worker viable at all. Create one with:
#   wrangler hyperdrive create data-foundry --connection-string="postgres://..."
# then paste the id below.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"

# `wrangler dev` against a local database can use POSTGRES_URL instead. Put it in
# .dev.vars (gitignored), never here: this file is committed.

# Where a usage event goes after a request is served. The queue name itself is
# not a credential — unlike the Hyperdrive id above, it is safe to commit — but
# the queue has to exist in the account before this binding resolves:
#   wrangler queues create data-foundry-usage-events
# `apps/usage-consumer/wrangler.toml` is the consumer side of this same queue.
[[queues.producers]]
binding = "USAGE_EVENTS_QUEUE"
queue = "data-foundry-usage-events"
