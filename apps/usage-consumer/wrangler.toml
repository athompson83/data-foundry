# Cloudflare Worker manifest for the usage-event queue consumer (ADR-0006).
#
# Same posture as `apps/edge/wrangler.toml`: `account_id` and the Hyperdrive
# `id` are deployment facts, left unset on purpose. `docs/owner-actions/`
# records what an operator has to supply. The queue names are not
# credentials and are committed here and in `apps/edge/wrangler.toml` —
# both sides of the same queue have to agree on its name.

name = "data-foundry-usage-consumer"
main = "src/index.ts"

# Required for `pg`, same reason as apps/edge: Hyperdrive reaches Postgres
# over Workers TCP sockets, and the driver needs Node built-ins to use them.
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[vars]
DEPLOYMENT_ENVIRONMENT = "production"

[[queues.consumers]]
queue = "data-foundry-usage-events"
# A batch's worth of messages is handed to one `queue()` invocation;
# `consumeBatch` parses independently, then persists all valid messages in one
# idempotent statement. 100 is Cloudflare's maximum and remains only 1,000 SQL
# parameters for this event shape.
max_batch_size = 100
max_batch_timeout = 5
# After this many redeliveries of the same message, Cloudflare routes it to
# the dead-letter queue below instead of retrying again. This consumer never
# acks a message it could not persist, and never asks for a message to be
# routed straight to the DLQ — that decision belongs to this platform
# setting, not to application code.
max_retries = 3
dead_letter_queue = "data-foundry-usage-events-dlq"

# Hyperdrive pools Postgres connections at the edge, exactly as in
# apps/edge/wrangler.toml. Create a role-specific configuration for this
# consumer; it must not reuse the edge Worker's Hyperdrive credential:
#   wrangler hyperdrive create data-foundry --connection-string="postgres://..."
# then place the id in an ignored `wrangler.production.toml` copy or the
# Cloudflare dashboard. Never uncomment it with a live id in this tracked file.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"

# `wrangler dev` against a local database can use POSTGRES_URL instead. Put it
# in .dev.vars (gitignored), never here: this file is committed.
