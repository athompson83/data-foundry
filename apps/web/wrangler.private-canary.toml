# Route-less target profile for the synthetic private canary. Copy this to the
# ignored wrangler.private-canary.production.toml and inject only account_id
# plus this Worker's role-specific Hyperdrive id. PUBLIC_ORIGIN and cache
# policy are intentionally absent because the RPC probe never renders a page.
name = "data-foundry-web"
main = "src/index.ts"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[vars]
DEPLOYMENT_ENVIRONMENT = "production"
PRIVATE_CANARY_MODE = "service-binding"

# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<web-role-hyperdrive-id>"
